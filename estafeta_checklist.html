<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Чек-листы судьи — Эстафета</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #eef2f7;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            margin: 0;
            padding: 24px 20px;
            color: #1e2a3e;

        .container { max-width: 1280px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #1e3a5f, #0f2b44);

            padding: 20px 28px;
            border-radius: 32px;
            margin-bottom: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .header h1 { margin: 0 0 6px; font-size: 1.9rem; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 16px 24px;
            border-radius: 48px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .print-btn {
            background: #1e6f3f;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .print-btn:hover { background: #0f5a33; transform: translateY(-2px); }
        .info-note {
            background: #fef9e3;
            border-left: 5px solid #f5a623;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #5e3a0c;
        }
        /* Компактный блок полей */
        .meta-fields {
            background: #fefce8;
            border-radius: 28px;
            padding: 12px 20px;
            margin-bottom: 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 10px 16px;
            border: 1px solid #fde68a;
        }
        .meta-field {
            display: flex;
            flex-direction: column;
            min-width: 80px;
        }
        .meta-field label {
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #b45309;
            margin-bottom: 2px;
            letter-spacing: 0.3px;
        }
        .meta-field input, .meta-field select {
            padding: 4px 8px;
            border-radius: 16px;
            border: 1px solid #d1d5db;
            font-size: 0.8rem;
            background: white;
            font-family: inherit;
        }
        .meta-field.remarks-field { flex-grow: 1; min-width: 120px; }
        .meta-field.remarks-field input { width: 100%; }
        @media (min-width: 800px) {
            .meta-fields { flex-wrap: nowrap; }
        }
        .stage-section {
            background: white;
            border-radius: 32px;
            margin-bottom: 32px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
        }
        .stage-header {
            background: #f1f5f9;
            padding: 18px 24px;
            border-radius: 32px 32px 0 0;
            border-bottom: 2px solid #cbd5e1;
        }
        .stage-header h2 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            color: #0c4a6e;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stage-header .stage-total {
            font-size: 0.85rem;
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: normal;
            margin-left: 12px;
        }
        .penalty-table { width: 100%; border-collapse: collapse; }
        .penalty-table th {
            text-align: left;
            padding: 16px 20px 8px 24px;
            font-weight: 600;
            color: #334155;
            font-size: 0.85rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .penalty-table td {
            padding: 12px 20px 12px 24px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }
        .penalty-desc { font-weight: 500; font-size: 0.95rem; }
        .penalty-seconds {
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            color: #1e3a5f;
            display: inline-block;
        }
        .check-col { width: 70px; text-align: center; }
        .counter-col { width: 130px; }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: #1e3a8a; transform: scale(1.1); }
        .counter-input {
            width: 80px;
            padding: 8px 10px;
            font-size: 0.9rem;
            text-align: center;
            border-radius: 28px;
            border: 1px solid #cbd5e1;
            background: white;
            font-weight: 500;
        }
        .sign-line {
            margin-top: 40px;
            border-top: 1px dashed #9ca3af;
            padding-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 30px;
        }
        .sign-item { flex: 1; min-width: 200px; }
        .sign-item span { font-weight: 600; border-bottom: 1px dotted #4b5563; }
        .stage-meta { display: none; }

        @media print {
            body {
                background: white;
                padding: 0.1in;
                margin: 0;
                font-size: 7pt;
            }
            .toolbar, .print-btn, .info-note, .meta-fields { display: none; }
            .stage-meta {
                display: flex;
                background: #fefce8;
                border: 1px solid #cca;
                border-radius: 20px;
                padding: 6px 10px;
                margin-bottom: 15px;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
            }
            .stage-meta .meta-field {
                flex-direction: row;
                align-items: center;
                gap: 4px;
                min-width: auto;
            }
            .stage-meta .meta-field label {
                font-size: 6pt;
                margin-bottom: 0;
            }
            .stage-meta .meta-field input, .stage-meta .meta-field select {
                font-size: 6pt;
                padding: 2px 4px;
                width: auto;
                min-width: 50px;
            }
            .stage-section {
                page-break-before: always;
                break-before: page;
                break-inside: auto;
                page-break-inside: auto;
                box-shadow: none;
                border: 1px solid #ccc;
                margin-bottom: 0;
            }
            .stage-section:first-child { page-break-before: avoid; }
            input[type="checkbox"] { transform: scale(0.8); border: 1px solid black; }
            .counter-input { border: 1px solid #000; background: none; padding: 2px; width: 40px; font-size: 7pt; }
            .stage-header { background: #eef2ff; padding: 6px 10px; }
            .stage-header h2 { font-size: 1rem; }
            .stage-header .stage-total { font-size: 0.7rem; padding: 2px 6px; }
            .penalty-table th, .penalty-table td { padding: 3px 5px; }
            .penalty-desc { font-size: 7pt; }
            .penalty-seconds { font-size: 6pt; padding: 1px 4px; }
            .sign-line { margin-top: 15px; padding-top: 10px; }
        }
    </style>
</head>

        { id: "obsh_svyaz", category: "Общие штрафы", desc: "Неаккуратное обращение со средствами связи (уронил носимую радиостанцию на пол в СТС/на дорожное покрытие)", sec: 30, isCounter: true, maxCount: 10 },
        { id: "obsh_ivr", category: "Общие штрафы", desc: "Неаккуратное обращение с ИВР (уронил ИВР на пол в СТС/на дорожное покрытие)", sec: 30, isCounter: true, maxCount: 10 },
        { id: "obsh_tsd", category: "Общие штрафы", desc: "Неаккуратное обращение с ТСД/радиотерминалом (уронил на пол в СТС/на дорожное покрытие)", sec: 30, isCounter: true, maxCount: 10 },
        { id: "obsh_gun", category: "Общие штрафы", desc: "Выпадение пистолета из кобуры", sec: 20, isCounter: true, maxCount: 10 },
        { id: "obsh_sts", category: "Общие штрафы", desc: "Выход из СТС/посадка в СТС не осуществлена в следующем порядке: инкассатор через заднюю правую дверь, водитель-инкассатор через левую переднюю дверь", sec: 20, isCounter: true, maxCount: 10 }
    ];

    const stages = [
        "Получение имущества",
        "Получение банковских ценностей",
        "Прокол шины",
        "Змейка",
        "Обслуживание УС",
        "Обслуживание ВСП",
        "Стрельба",
        "Пожар",
        "Медицина",
        "Инкассация объекта",
        "Вооруженный преступник",
        "Наручники",
        "Общие штрафы"
    ];

    function createMetaClone() {
        const original = document.getElementById('mainMetaBlock');
        if (!original) return null;
        const clone = document.createElement('div');
        clone.className = 'stage-meta';
        const fields = original.querySelectorAll('.meta-field');
        fields.forEach(field => {
            const clonedField = field.cloneNode(true);
            const inputs = clonedField.querySelectorAll('input, select');
            inputs.forEach(inp => { if (inp.id) inp.id = inp.id + '_clone_' + Math.random().toString(36).substr(2, 6); });
            clone.appendChild(clonedField);
        });
        return clone;
    }

    function syncMetaToClones() {
        const main = document.getElementById('mainMetaBlock');
        const clones = document.querySelectorAll('.stage-meta');
        if (!main) return;
        const tb = main.querySelector('#tbSelect')?.value || '';
        const dir = main.querySelector('#direction')?.value || '';
        const judge = main.querySelector('#judgeName')?.value || '';
        const date = main.querySelector('#eventDate')?.value || '';
        const remarks = main.querySelector('#remarks')?.value || '';
        clones.forEach(clone => {
            const tbSel = clone.querySelector('select[id*="tbSelect"]'); if (tbSel) tbSel.value = tb;
            const dirInp = clone.querySelector('input[id*="direction"]'); if (dirInp) dirInp.value = dir;
            const judgeInp = clone.querySelector('input[id*="judgeName"]'); if (judgeInp) judgeInp.value = judge;
            const dateInp = clone.querySelector('input[id*="eventDate"]'); if (dateInp) dateInp.value = date;
            const remarksInp = clone.querySelector('input[id*="remarks"]'); if (remarksInp) remarksInp.value = remarks;
        });
    }

    function buildChecklists() {
        const container = document.getElementById('stagesContainer');
        container.innerHTML = '';
        for (let idx = 0; idx < stages.length; idx++) {
            const stage = stages[idx];
            const stagePenalties = penaltiesLibrary.filter(p => p.category === stage);
            const section = document.createElement('div');
            section.className = 'stage-section';
            const metaClone = createMetaClone();
            if (metaClone) section.appendChild(metaClone);
            const headerDiv = document.createElement('div');
            headerDiv.className = 'stage-header';
            headerDiv.innerHTML = `<h2>🏁 ${stage} <span class="stage-total">${stagePenalties.length} нарушений</span></h2>`;
            section.appendChild(headerDiv);
            const table = document.createElement('table');
            table.className = 'penalty-table';
            const thead = document.createElement('thead');
            thead.innerHTML = `<tr><th>Нарушение / описание</th><th class="check-col">✓ Отметка</th><th class="counter-col">Кол-во (для счётчика)</th><th>Штраф (сек)</th></tr>`;
            table.appendChild(thead);
            const tbody = document.createElement('tbody');

            // Спецобработка для этапов с конусами и стрельбой
            if (stage === "Получение банковских ценностей") {
                const row = document.createElement('tr');
                row.innerHTML = `<td class="penalty-desc"><strong>Наезд на конусы (при заезде в бокс)</strong> (каждый конус = +5 сек)</td><td class="check-col">—</td><td class="counter-col"><input type="number" class="counter-input" min="0" max="20" value="0" step="1"><tr><td class="penalty-seconds">+5 сек/конус</span></td>`;
                tbody.appendChild(row);
            }
            if (stage === "Змейка") {
                const row = document.createElement('tr');
                row.innerHTML = `<td class="penalty-desc"><strong>Наезд на конус/бочку</strong> (каждый конус = +5 сек)</td><td class="check-col">—</td><td class="counter-col"><input type="number" class="counter-input" min="0" max="20" value="0" step="1"></td><td><span class="penalty-seconds">+5 сек/конус</span></td>`;
                tbody.appendChild(row);
            }
            if (stage === "Вооруженный преступник") {
                const row = document.createElement('tr');
                row.innerHTML = `<td class="penalty-desc"><strong>Наезд на конус (преступник)</strong> (каждый конус = +5 сек)</td><td class="check-col">—</td><td class="counter-col"><input type="number" class="counter-input" min="0" max="20" value="0" step="1"></td><td><span class="penalty-seconds">+5 сек/конус</span></td>`;
                tbody.appendChild(row);
            }
            if (stage === "Стрельба") {
                const rowPm = document.createElement('tr');
                rowPm.innerHTML = `<td class="penalty-desc"><strong>🔫 ПМ (4 выстрела) — ПРОМАХИ</strong> (каждый промах = +30 сек)</td><td class="check-col">—</td><td class="counter-col"><input type="number" class="counter-input pm-misses" min="0" max="4" value="0" step="1"></td><td><span class="penalty-seconds">+30 сек/промах</span></td>`;
                tbody.appendChild(rowPm);
                const rowSaiga = document.createElement('tr');
                rowSaiga.innerHTML = `<td class="penalty-desc"><strong>🎯 САЙГА-12 (5 выстрелов) — ПОПАДАНИЯ</strong> (каждое попадание = –10 сек)</td><td class="check-col">—</td><td class="counter-col"><input type="number" class="counter-input saiga-hits" min="0" max="5" value="0" step="1"></td><td><span class="penalty-seconds">–10 сек/попадание</span></td>`;
                tbody.appendChild(rowSaiga);
            }

            const skipIds = [];
            if (stage === "Получение банковских ценностей") skipIds.push('bank_cone_1','bank_cone_2','bank_cone_3','bank_cone_4');
            if (stage === "Змейка") skipIds.push('snake_cone','snake_cone1','snake_cone2','snake_cone3');
            if (stage === "Вооруженный преступник") skipIds.push('prestupnik_cone','prestupnik_cone1','prestupnik_cone2','prestupnik_cone3');
            for (let p of stagePenalties) {
                if (skipIds.includes(p.id)) continue;
                const row = document.createElement('tr');
                if (p.isCounter) {
                    const maxVal = p.maxCount || 99;
                    row.innerHTML = `<td class="penalty-desc">${p.desc}${p.maxCount ? ` (макс. ${p.maxCount})` : ''}</td><td class="check-col">—</td><td class="counter-col"><input type="number" class="counter-input" min="0" max="${maxVal}" value="0" step="1"></td><td><span class="penalty-seconds">+${p.sec} сек/каждое</span></td>`;
                } else {
                    row.innerHTML = `<td class="penalty-desc">${p.desc}</td><td class="check-col"><input type="checkbox"></td><td class="counter-col">—</td><td><span class="penalty-seconds">+${p.sec} сек</span></td>`;
                }
                tbody.appendChild(row);
            }
            table.appendChild(tbody);
            section.appendChild(table);

            // Только подписи, футер УБРАН
            const signBlock = document.createElement('div');
            signBlock.className = 'sign-line';
            signBlock.innerHTML = `<div class="sign-item"><span>Подпись судьи</span><br><br> __________________________</div><div class="sign-item"><span>Подпись представителя команды</span><br><br> __________________________</div><div class="sign-item"><span>Расшифровка подписи</span><br><br> __________________________</div>`;
            section.appendChild(signBlock);

            container.appendChild(section);
        }
        syncMetaToClones();
        const mainInputs = document.querySelectorAll('#mainMetaBlock input, #mainMetaBlock select');
        mainInputs.forEach(inp => { inp.addEventListener('input', () => syncMetaToClones()); inp.addEventListener('change', () => syncMetaToClones()); });
    }

    document.getElementById('printChecklistsBtn').addEventListener('click', () => { syncMetaToClones(); window.print(); });
    buildChecklists();

    const placeholders = document.querySelectorAll('#mainMetaBlock input');
    placeholders.forEach(inp => {
        if (inp.value === "_________________________" || inp.value === "______" || inp.value === "____.____.20__") {
            inp.style.color = "#6c757d";
            inp.addEventListener('focus', function() { if (this.value === "_________________________" || this.value === "______" || this.value === "____.____.20__") this.value = ""; });
            inp.addEventListener('blur', function() {
                if (this.value === "") {
                    if (this.id === "direction") this.value = "______";
                    else if (this.id === "eventDate") this.value = "____.____.20__";
                    else this.value = "_________________________";
                    syncMetaToClones();
                }
            });
        }
    });
</script>
</body>
</html>
