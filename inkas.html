<!DOCTYPE html>
<html lang="ru">
<head>

        .container { max-width: 1400px; margin: 0 auto; }
        .header {

            color: white;
            padding: 20px;
            border-radius: 28px;
            margin-bottom: 30px;
            text-align: center;
        }
        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .title-logo {
            height: 60px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 12px;
        }
        .header h1 { font-size: 1.8rem; line-height: 1.2; }
        .header p { opacity: 0.9; font-size: 1rem; }
        .team-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0 8px;
        }
        .team-selector select {
            padding: 8px 16px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            background: white;
            color: #1e293b;
            cursor: pointer;
            min-width: 200px;
        }
        .team-selector label {
            font-weight: 600;
            font-size: 1rem;
        }
        .header-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .header-actions button {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .header-actions button:hover { background: rgba(255,255,255,0.35); }
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #1e293b;
            transition: 0.2s;
        }
        .tab-btn.active { background: #1e3a5f; color: white; }
        .tab-pane { display: none; animation: fadeIn 0.3s ease; }
        .tab-pane.active-pane { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .section {
            background: white;
            border-radius: 28px;
            padding: 24px 20px;
            margin-bottom: 32px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
        }
        .section h2 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #0f2b44;
            border-left: 6px solid #dc2626;
            padding-left: 18px;
        }
        .section h3 {
            font-size: 1.2rem;
            margin: 16px 0 10px;
            color: #1e3a5f;
        }
        .section h4 {
            font-size: 1.1rem;
            margin: 14px 0 8px;
            color: #2c3e66;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px 6px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        th { background: #f8fafc; font-weight: 700; }
        .rank-1 { background-color: #ffd966 !important; font-weight: bold; }
        .rank-2 { background-color: #e0e0e0 !important; font-weight: bold; }
        .rank-3 { background-color: #f7d9b5 !important; font-weight: bold; }
        .medal-icon { font-size: 1.2rem; margin-right: 4px; }
        .place-number { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
        .subnote { margin-top: 12px; font-size: 0.75rem; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 10px; text-align: right; }
        .penalty-block {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }
        .penalty-block .row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .penalty-block label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .penalty-block input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .penalty-block input[type="number"] {
            width: 60px;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            text-align: center;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .action-buttons button {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-save { background: #1e3a5f; color: white; }
        .btn-save:hover { background: #0f2b44; }
        .btn-reset { background: #f97316; color: white; }
        .btn-reset:hover { background: #ea580c; }
        .btn-print { background: #2c5f2d; color: white; }
        .btn-print:hover { background: #1f4a20; }
        .btn-excel { background: #1e6f3f; color: white; }
        .btn-excel:hover { background: #0f5a33; }
        .btn-overall { background: #1e4a6f; color: white; }
        .btn-overall:hover { background: #143a55; }
        .unsaved-badge {
            background: #fef3c7;
            color: #b45309;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 10px;
        }
        .summary-bar {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 14px;
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-weight: 600;
        }
        .stage-summary {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            background: #eef2ff;
            padding: 8px 14px;
            border-radius: 30px;
            margin-top: 8px;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #5c6f87;
            font-size: 0.75rem;
        }
        .time-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .time-row label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1e293b;
        }
        .time-input {
            width: 100%;
            max-width: 280px;
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            color: #0f172a;
        }
        .time-input:focus {
            border-color: #1e3a5f;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.15);
        }
        .time-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.95rem;
        }
        .counter-control {
            display: inline-flex;
            align-items: center;
            gap: 0;
            background: #eef2ff;
            border-radius: 30px;
            padding: 2px;
            border: 1px solid #d1d9e6;
        }
        .counter-control button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #1e3a5f;
            font-size: 1rem; /* теперь как у основного текста */
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            line-height: 1;
        }
        .counter-control button:hover {
            background: rgba(30, 58, 95, 0.12);
        }
        .counter-control button:active {
            background: rgba(30, 58, 95, 0.2);
        }
        .counter-control .counter-count {
            min-width: 32px;
            text-align: center;
            font-weight: 400; /* убрали жирность */
            font-size: 0.9rem; /* как у описаний */
            color: #0f172a;
            padding: 0 4px;
        }
        .counter-total {
            font-weight: 600;
            color: #1e3a5f;
            margin-left: 6px;
        }
        .counter-penalty-label {
            font-size: 0.9rem;
            color: #334155;
            margin-left: 8px;
        }
        @media (max-width: 700px) {
            th, td { padding: 6px 4px; font-size: 0.8rem; }
            .section h2 { font-size: 1.3rem; }
            .tab-btn { padding: 8px 16px; font-size: 0.9rem; }
            .title-logo { height: 40px; }
            .header h1 { font-size: 1.4rem; }
            .penalty-block .row { gap: 6px; }
            .action-buttons button { width: 100%; }
            .time-input { max-width: 100%; }
        }
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .container { max-width: 100%; padding: 10px; }
            .header, .footer, .team-selector, .header-actions, .tabs, .tab-btn,
            .action-buttons, .penalty-block, .summary-bar, .stage-summary,
            .tab-pane, .section { display: none !important; }
            .print-report-area { display: block !important; }
            .print-report-area * { display: revert; }
            .print-report-area table { border-collapse: collapse; }
            .print-report-area th, .print-report-area td { border: 1px solid #888; padding: 4px 6px; text-align: center; }
            .rank-1, .rank-2, .rank-3 { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            @page { size: A4 portrait; margin: 8mm 6mm; }
        }
        .print-report-area { display: none; }
    </style>
</head>

        Финальный этап конкурса «Лучший инкассатор 2026» – г. Уфа, 07–09 октября
    </footer>
</div>

    function formatTime(sec) {
        if (sec === null || isNaN(sec)) return "—";
        let m = Math.floor(sec / 60);
        let s = (sec % 60).toFixed(2);
        return `${m}:${s.toString().padStart(5, '0')}`;
    }

    function parseTime(str) {
        if (!str.trim()) return null;
        let parts = str.split(':');
        let m = 0, s = 0;
        if (parts.length === 2) { m = parseInt(parts[0]); s = parseFloat(parts[1]); }
        else if (parts.length === 3) { m = parseInt(parts[0])*60 + parseInt(parts[1]); s = parseFloat(parts[2]); }
        else if (parts.length === 1) { s = parseFloat(parts[0]); }
        else return null;
        if (isNaN(m) || isNaN(s)) return null;
        return m * 60 + s;
    }

    function getPenaltySum(penObj, disc, stage) {
        let sum = 0;
        let lib;
        if (disc === 'special' && stage) {
            lib = penaltiesLibrary.special[stage] || [];
        } else if (disc === 'estafeta' && stage) {
            const stageData = ESTAFETA_STAGES.find(s => s.id === stage);
            if (stageData) lib = stageData.penalties;
            else return 0;
        } else {
            lib = penaltiesLibrary[disc] || [];
        }
        for (let id in penObj) {
            const val = penObj[id];
            const p = lib.find(p => p.id === id);
            if (p) {
                if (typeof val === 'number' && p.isCounter) sum += val * p.sec;
                else if (val === true || val === 1) sum += p.sec;
                else if (typeof val === 'number') sum += val * p.sec;
            }
        }
        return sum;
    }

    function getCounterValue(penObj, counterId) {
        const val = penObj[counterId];
        if (typeof val === 'number') return val;
        if (val === true) return 1;
        return 0;
    }

    function setCounterValue(penObj, counterId, value) {
        if (value <= 0) delete penObj[counterId];
        else penObj[counterId] = value;
    }

    function getTeamDisciplineData(teamCode, discipline) {
        if (!teamsData[teamCode]) {
            teamsData[teamCode] = { disciplines: {} };
        }
        if (!teamsData[teamCode].disciplines[discipline]) {
            if (discipline === 'special') {
                teamsData[teamCode].disciplines[discipline] = {
                    practice: { rawSeconds: null, penalties: {} },
                    test: { rawSeconds: null, penalties: {} }
                };
            } else if (discipline === 'estafeta') {
                const stages = {};
                for (let s of ESTAFETA_STAGES) {
                    stages[s.id] = { penalties: {} };
                }
                teamsData[teamCode].disciplines[discipline] = {
                    rawSeconds: null,
                    stages: stages
                };
            } else {
                teamsData[teamCode].disciplines[discipline] = { rawSeconds: null, penalties: {} };
            }
        }
        return teamsData[teamCode].disciplines[discipline];
    }

    function getEstafetaStageData(teamCode, stageId) {

        return discData.stages[stageId];
    }

                        if (!teamsData[code].disciplines[d].test) teamsData[code].disciplines[d].test = { rawSeconds: null, penalties: {} };
                    }
                } else if (d === 'estafeta') {

        else if (currentDiscipline === 'estafeta') refreshEstafetaUI();
        else refreshDisciplineUI(currentDiscipline);

    function refreshDisciplineUI(disc) {
        const discData = getTeamDisciplineData(currentTeam, disc);
        const penObj = discData.penalties || {};
        const rawInput = document.getElementById(`rawTime-${disc}`);
        if (rawInput) rawInput.value = discData.rawSeconds !== null ? formatTime(discData.rawSeconds) : "";

        if (!tempPenalties[disc]) tempPenalties[disc] = {};
        const discTemp = tempPenalties[disc];
        const disciplinePenalties = penaltiesLibrary[disc] || [];
        for (let p of disciplinePenalties) {
            if (penObj[p.id] !== undefined) discTemp[p.id] = penObj[p.id];
            else delete discTemp[p.id];
        }
        unsaved = false;
        updatePenaltiesUI(disc);
        updateSummary(disc);
        updateStageBadge(disc);
        renderOverallTable(disc);
    }

    // ===== ТАБЛИЦА ОБЩЕГО ЗАЧЁТА =====
    function renderOverallTable(disc) {
        const tbody = document.getElementById(`overallBody-${disc}`);
        if (!tbody) return;
        let rows = [];
        for (let code of TEAM_CODES) {
            const team = teamsData[code];
            if (!team) continue;
            let raw, pen, total;
            if (disc === 'special') {
                let totalRaw = 0, totalPen = 0, has = false;
                for (let stage of SPECIAL_STAGES) {
                    const stageData = getSpecialStageData(code, stage);
                    const r = stageData.rawSeconds;
                    const p = getPenaltySum(stageData.penalties, 'special', stage);
                    if (r !== null) { totalRaw += r; totalPen += p; has = true; }
                }
                raw = has ? totalRaw : null;
                pen = totalPen;
                total = raw !== null ? raw + pen : null;
            } else if (disc === 'estafeta') {
                const discData = getTeamDisciplineData(code, 'estafeta');
                let totalPen = 0;
                for (let stage of ESTAFETA_STAGES) {
                    const stageData = getEstafetaStageData(code, stage.id);
                    totalPen += getPenaltySum(stageData.penalties, 'estafeta', stage.id);
                }
                raw = discData.rawSeconds;
                pen = totalPen;
                total = raw !== null ? raw + pen : null;
            } else {
                const discData = getTeamDisciplineData(code, disc);
                raw = discData.rawSeconds;
                pen = getPenaltySum(discData.penalties, disc);
                total = raw !== null ? raw + pen : null;
            }
            rows.push({ code, name: TEAM_NAMES[code] || code, raw, pen, total });
        }
        rows.sort((a,b) => (a.total ?? Infinity) - (b.total ?? Infinity));
        let rank = 1;
        let html = '';
        for (let r of rows) {
            const place = r.total !== null ? rank++ : '—';
            let cls = '';
            if (r.total !== null && rank-1 === 1) cls = 'rank-1';
            else if (r.total !== null && rank-1 === 2) cls = 'rank-2';
            else if (r.total !== null && rank-1 === 3) cls = 'rank-3';
            const placeHtml = (r.total !== null && parseInt(place) <= 3) ?
                `<span class="place-number"><span class="medal-icon">${place===1?'🥇':place===2?'🥈':'🥉'}</span> ${place}</span>` :
                place;
            html += `<tr class="${cls}"><td>${placeHtml}</td><td><strong>${r.name}</strong> (${r.code})</td><td>${r.raw !== null ? formatTime(r.raw) : '—'}</td><td>${r.pen}</td><td><strong>${r.total !== null ? formatTime(r.total) : '—'}</strong></td></tr>`;
        }
        if (!rows.length || rows.every(r => r.total === null)) html = '<tr><td colspan="5">Нет данных. Внесите результаты.</td></tr>';
        tbody.innerHTML = html;
    }

    // ===== ОБНОВЛЕНИЕ ВКЛАДКИ ИТОГИ =====
    function renderOverallResults() {
        const tbody = document.getElementById('resultsOverallBody');
        if (!tbody) return;
        let summary = [];
        for (let code of TEAM_CODES) {
            const team = teamsData[code];
            if (!team) continue;
            let places = {};
            let totalSum = 0;
            let hasData = false;
            for (let d of DISCIPLINES) {
                let totalVal = null;
                if (d === 'special') {
                    let totalRaw = 0, totalPen = 0, has = false;
                    for (let stage of SPECIAL_STAGES) {
                        const stageData = getSpecialStageData(code, stage);
                        const r = stageData.rawSeconds;
                        const p = getPenaltySum(stageData.penalties, 'special', stage);
                        if (r !== null) { totalRaw += r; totalPen += p; has = true; }
                    }
                    totalVal = has ? totalRaw + totalPen : null;
                } else if (d === 'estafeta') {
                    const discData = getTeamDisciplineData(code, 'estafeta');
                    let totalPen = 0;
                    for (let stage of ESTAFETA_STAGES) {
                        const stageData = getEstafetaStageData(code, stage.id);
                        totalPen += getPenaltySum(stageData.penalties, 'estafeta', stage.id);
                    }
                    const raw = discData.rawSeconds;
                    totalVal = raw !== null ? raw + totalPen : null;
                } else {
                    const discData = getTeamDisciplineData(code, d);
                    const raw = discData.rawSeconds;
                    const pen = getPenaltySum(discData.penalties, d);
                    totalVal = raw !== null ? raw + pen : null;
                }
                let place = 12;
                if (totalVal !== null) {
                    let totals = [];
                    for (let c of TEAM_CODES) {
                        let val = null;
                        if (d === 'special') {
                            let tr = 0, tp = 0, h = false;
                            for (let stage of SPECIAL_STAGES) {
                                const sd = getSpecialStageData(c, stage);
                                const r = sd.rawSeconds;
                                const p = getPenaltySum(sd.penalties, 'special', stage);
                                if (r !== null) { tr += r; tp += p; h = true; }
                            }
                            val = h ? tr + tp : null;
                        } else if (d === 'estafeta') {
                            const discData2 = getTeamDisciplineData(c, 'estafeta');
                            let totalPen2 = 0;
                            for (let stage of ESTAFETA_STAGES) {
                                const stageData = getEstafetaStageData(c, stage.id);
                                totalPen2 += getPenaltySum(stageData.penalties, 'estafeta', stage.id);
                            }
                            val = discData2.rawSeconds !== null ? discData2.rawSeconds + totalPen2 : null;
                        } else {
                            const dd = getTeamDisciplineData(c, d);
                            const r = dd.rawSeconds;
                            const p = getPenaltySum(dd.penalties, d);
                            val = r !== null ? r + p : null;
                        }
                        if (val !== null) totals.push({ code: c, total: val });
                    }
                    totals.sort((a,b) => a.total - b.total);
                    let rank = 1;
                    for (let item of totals) {
                        if (item.code === code) { place = rank; break; }
                        rank++;
                    }
                    hasData = true;
                }
                places[d] = place;
                totalSum += place;
            }
            if (hasData) {
                summary.push({
                    code,
                    name: TEAM_NAMES[code] || code,
                    places,
                    totalSum,
                    estafetaPlace: places.estafeta || 12,
                    firePlace: places.fire || 12
                });
            }
        }
        summary.sort((a,b) => {
            if (a.totalSum !== b.totalSum) return a.totalSum - b.totalSum;
            if (a.estafetaPlace !== b.estafetaPlace) return a.estafetaPlace - b.estafetaPlace;
            return a.firePlace - b.firePlace;
        });

        let rank = 1;
        let html = '';
        for (let s of summary) {
            const place = rank++;
            let cls = '';
            if (place === 1) cls = 'rank-1';
            else if (place === 2) cls = 'rank-2';
            else if (place === 3) cls = 'rank-3';
            const placeHtml = place <= 3 ? `<span class="place-number"><span class="medal-icon">${place===1?'🥇':place===2?'🥈':'🥉'}</span> ${place}</span>` : place;
            html += `<tr class="${cls}"><td>${placeHtml}</td><td><strong>${s.name}</strong> (${s.code})</td>`;
            for (let d of DISCIPLINES) {
                html += `<td>${s.places[d] || '—'}</td>`;
            }
            html += `<td><strong>${s.totalSum}</strong></td></tr>`;
        }
        if (!summary.length) html = '<tr><td colspan="8">Нет данных.</td></tr>';
        tbody.innerHTML = html;
    }

    function autoSaveRawTime(disc, stage) {
        if (!currentTeam) return;
        let rawInput;
        if (disc === 'special' && stage) {
            rawInput = document.getElementById(`rawTime-special-${stage}`);
        } else if (disc === 'estafeta') {
            rawInput = document.getElementById(`rawTime-estafeta`);

            rawInput = document.getElementById(`rawTime-${disc}`);
        }
        if (!rawInput) return;
        const rawStr = rawInput.value.trim();
        let seconds = rawStr === "" ? null : parseTime(rawStr);
        if (rawStr !== "" && seconds === null) return;
        if (disc === 'special' && stage) {
            const stageData = getSpecialStageData(currentTeam, stage);
            stageData.rawSeconds = seconds;
        } else if (disc === 'estafeta') {
            const discData = getTeamDisciplineData(currentTeam, 'estafeta');
            discData.rawSeconds = seconds;
        } else {
            const discData = getTeamDisciplineData(currentTeam, disc);
            discData.rawSeconds = seconds;
        }
        saveAllData();
        if (disc === 'special') { updateSpecialSummary(); renderOverallTable('special'); }
        else if (disc === 'estafeta') { updateEstafetaSummary(); renderOverallTable('estafeta'); }
        else { updateSummary(disc); renderOverallTable(disc); }
        renderOverallResults();
    }

    // ===== ПЕЧАТЬ =====
    function printTeamReport() {
        if (!currentTeam) { alert('Выберите команду'); return; }
        const disc = currentDiscipline;
        const team = teamsData[currentTeam];
        if (!team) return;

        let raw, penSum, total, violations = [];
        if (disc === 'special') {
            let totalRaw = 0, totalPen = 0, has = false;
            for (let stage of SPECIAL_STAGES) {
                const stageData = getSpecialStageData(currentTeam, stage);
                const r = stageData.rawSeconds;
                const p = getPenaltySum(stageData.penalties, 'special', stage);
                if (r !== null) { totalRaw += r; totalPen += p; has = true; }
                const penObj = stageData.penalties || {};
                for (let id in penObj) {
                    const val = penObj[id];
                    const pLib = penaltiesLibrary.special[stage]?.find(p => p.id === id);
                    if (pLib) {
                        if (pLib.isCounter && typeof val === 'number' && val > 0) {
                            for (let i=0; i<val; i++) violations.push({ desc: pLib.desc + ` (${i+1}-й раз, этап ${stage})`, sec: pLib.sec });
                        } else if (val === true || val === 1) violations.push({ desc: pLib.desc + ` (этап ${stage})`, sec: pLib.sec });
                        else if (typeof val === 'number' && val > 0 && !pLib.isCounter) {
                            for (let i=0; i<val; i++) violations.push({ desc: pLib.desc + ` (${i+1}-й раз, этап ${stage})`, sec: pLib.sec });
                        }
                    }
                }
            }
            raw = has ? totalRaw : null;
            penSum = totalPen;
            total = raw !== null ? raw + penSum : null;
        } else if (disc === 'estafeta') {
            const discData = getTeamDisciplineData(currentTeam, 'estafeta');
            let totalPen = 0;
            for (let stage of ESTAFETA_STAGES) {
                const stageData = getEstafetaStageData(currentTeam, stage.id);
                totalPen += getPenaltySum(stageData.penalties, 'estafeta', stage.id);
                const penObj = stageData.penalties || {};
                for (let id in penObj) {
                    const val = penObj[id];
                    const pLib = stage.penalties.find(p => p.id === id);
                    if (pLib) {
                        if (pLib.isCounter && typeof val === 'number' && val > 0) {
                            for (let i=0; i<val; i++) violations.push({ desc: pLib.desc + ` (${i+1}-й раз, этап ${stage.label})`, sec: pLib.sec });
                        } else if (val === true || val === 1) violations.push({ desc: pLib.desc + ` (этап ${stage.label})`, sec: pLib.sec });
                        else if (typeof val === 'number' && val > 0 && !pLib.isCounter) {
                            for (let i=0; i<val; i++) violations.push({ desc: pLib.desc + ` (${i+1}-й раз, этап ${stage.label})`, sec: pLib.sec });
                        }
                    }
                }
            }
            raw = discData.rawSeconds;
            penSum = totalPen;
            total = raw !== null ? raw + penSum : null;
        } else {
            const discData = getTeamDisciplineData(currentTeam, disc);
            raw = discData.rawSeconds;
            penSum = getPenaltySum(discData.penalties, disc);
            total = raw !== null ? raw + penSum : null;
            const penObj = discData.penalties || {};
            const lib = penaltiesLibrary[disc] || [];
            for (let id in penObj) {
                const val = penObj[id];
                const p = lib.find(p => p.id === id);
                if (p) {
                    if (p.isCounter && typeof val === 'number' && val > 0) {
                        for (let i=0; i<val; i++) violations.push({ desc: p.desc + ` (${i+1}-й раз)`, sec: p.sec });
                    } else if (val === true || val === 1) violations.push({ desc: p.desc, sec: p.sec });
                    else if (typeof val === 'number' && val > 0 && !p.isCounter) {
                        for (let i=0; i<val; i++) violations.push({ desc: p.desc + ` (${i+1}-й раз)`, sec: p.sec });
                    }
                }
            }
        }

        const now = new Date().toLocaleString('ru-RU');
        let tableRows = violations.length ? violations.map(v => `<tr><td>${v.desc}</td><td>+${v.sec}</td></tr>`).join('') : '<tr><td colspan="2">✅ Штрафные нарушения отсутствуют</td></tr>';

                    <thead><tr style="background:#e2e8f0;"><th style="padding:6px; text-align:left;">Нарушение</th><th style="padding:6px; width:100px;">Штраф (сек)</th></tr></thead>

                        <div><strong>Дата:</strong> __________________</div>
                    </div>

            </div>
        `;
        const container = document.getElementById('printReportContainer');
        container.innerHTML = html;
        container.style.display = 'block';
        window.print();
        container.style.display = 'none';
        container.innerHTML = '';
    }

    function printOverallReport() {
        const disc = currentDiscipline;
        let rows = [];
        for (let code of TEAM_CODES) {
            const team = teamsData[code];
            if (!team) continue;
            let raw, pen, total;
            if (disc === 'special') {
                let totalRaw = 0, totalPen = 0, has = false;
                for (let stage of SPECIAL_STAGES) {
                    const stageData = getSpecialStageData(code, stage);
                    const r = stageData.rawSeconds;
                    const p = getPenaltySum(stageData.penalties, 'special', stage);
                    if (r !== null) { totalRaw += r; totalPen += p; has = true; }
                }
                raw = has ? totalRaw : null;
                pen = totalPen;
                total = raw !== null ? raw + pen : null;
            } else if (disc === 'estafeta') {
                const discData = getTeamDisciplineData(code, 'estafeta');
                let totalPen = 0;
                for (let stage of ESTAFETA_STAGES) {
                    const stageData = getEstafetaStageData(code, stage.id);
                    totalPen += getPenaltySum(stageData.penalties, 'estafeta', stage.id);
                }
                raw = discData.rawSeconds;
                pen = totalPen;
                total = raw !== null ? raw + pen : null;
            } else {
                const discData = getTeamDisciplineData(code, disc);
                raw = discData.rawSeconds;
                pen = getPenaltySum(discData.penalties, disc);
                total = raw !== null ? raw + pen : null;
            }
            rows.push({ code, name: TEAM_NAMES[code] || code, raw, pen, total });
        }
        rows.sort((a,b) => (a.total ?? Infinity) - (b.total ?? Infinity));
        let rank = 1;
        let tableRows = '';
        for (let r of rows) {
            const place = r.total !== null ? rank++ : '—';
            tableRows += `<tr><td>${place}</td><td><strong>${r.name}</strong> (${r.code})</td><td>${r.raw !== null ? formatTime(r.raw) : '—'}</td><td>${r.pen}</td><td><strong>${r.total !== null ? formatTime(r.total) : '—'}</strong></td></tr>`;
        }
        if (!rows.length || rows.every(r => r.total === null)) tableRows = '<tr><td colspan="5">Нет данных</td></tr>';

        const now = new Date().toLocaleString('ru-RU');
        const html = `
            <div style="font-family: 'Segoe UI', sans-serif; max-width: 1100px; margin:0 auto; padding:5mm 4mm;">
                <h1 style="text-align:center; font-size:14pt;">🏆 ИТОГОВЫЙ ПРОТОКОЛ</h1>
                <h2 style="text-align:center; font-size:12pt; color:#1e3a5f;">${DISCIPLINE_LABELS[disc] || disc}</h2>
                <div style="text-align:center; font-size:8.5pt; margin-bottom:8px;">Дата формирования: ${now}</div>
                <table style="width:100%; border-collapse:collapse; font-size:8.5pt;">
                    <thead><tr style="background:#eef;"><th>Место</th><th>Команда</th><th>Чистое время</th><th>Штраф (сек)</th><th>Итог</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <div style="margin-top:16px; border-top:1px dashed #aaa; padding-top:10px;">
                    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px;">
                        <div><strong>Главный судья:</strong> __________________</div>
                        <div><strong>Секретарь:</strong> __________________</div>
                    </div>
                    <div style="margin-top:10px; display:flex; justify-content:flex-end;">
                        <div><strong>Дата:</strong> __________________</div>
                    </div>
                    <div style="margin-top:10px; font-size:8pt; text-align:center; color:#6c757d;">Официальный протокол</div>
                </div>
            </div>
        `;
        const container = document.getElementById('printReportContainer');
        container.innerHTML = html;
        container.style.display = 'block';
        window.print();

    // ===== ЭКСПОРТ В EXCEL =====
    function exportExcel() {
        const disc = currentDiscipline;
        let rows = [];
        for (let code of TEAM_CODES) {
            const team = teamsData[code];
            if (!team) continue;
            let raw, pen, total;
            if (disc === 'special') {
                let totalRaw = 0, totalPen = 0, has = false;
                for (let stage of SPECIAL_STAGES) {
                    const stageData = getSpecialStageData(code, stage);
                    const r = stageData.rawSeconds;
                    const p = getPenaltySum(stageData.penalties, 'special', stage);
                    if (r !== null) { totalRaw += r; totalPen += p; has = true; }
                }
                raw = has ? totalRaw : null;
                pen = totalPen;
                total = raw !== null ? raw + pen : null;
            } else if (disc === 'estafeta') {
                const discData = getTeamDisciplineData(code, 'estafeta');
                let totalPen = 0;
                for (let stage of ESTAFETA_STAGES) {
                    const stageData = getEstafetaStageData(code, stage.id);
                    totalPen += getPenaltySum(stageData.penalties, 'estafeta', stage.id);
                }
                raw = discData.rawSeconds;
                pen = totalPen;
                total = raw !== null ? raw + pen : null;
            } else {
                const discData = getTeamDisciplineData(code, disc);
                raw = discData.rawSeconds;
                pen = getPenaltySum(discData.penalties, disc);
                total = raw !== null ? raw + pen : null;
            }
            rows.push({
                "Команда": `${TEAM_NAMES[code]} (${code})`,
                "Чистое время": raw !== null ? formatTime(raw) : "—",
                "Штраф (сек)": pen,
                "Итог": total !== null ? formatTime(total) : "—"
            });
        }
        rows.sort((a,b) => {
            const tA = a["Итог"] === "—" ? Infinity : parseTime(a["Итог"]);
            const tB = b["Итог"] === "—" ? Infinity : parseTime(b["Итог"]);
            return tA - tB;
        });
        const wsData = [["Место", ...Object.keys(rows[0] || {})]];
        rows.forEach((row, idx) => {
            const place = row["Итог"] !== "—" ? idx+1 : "—";
            wsData.push([place, ...Object.values(row)]);
        });
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, DISCIPLINE_LABELS[disc] || disc);
        XLSX.writeFile(wb, `incassator_${disc}_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // ===== ПРИВЯЗКА ОБРАБОТЧИКОВ (без изменений) =====
    function attachEventListeners() {
        // Special
        for (let stage of SPECIAL_STAGES) {
            const saveBtn = document.getElementById(`saveStage-special-${stage}`);
            if (saveBtn) saveBtn.addEventListener('click', () => saveSpecialStage(stage));
            const resetBtn = document.getElementById(`resetStage-special-${stage}`);
            if (resetBtn) resetBtn.addEventListener('click', () => resetSpecialStage(stage));
            const rawInput = document.getElementById(`rawTime-special-${stage}`);
            if (rawInput) {
                rawInput.addEventListener('blur', () => autoSaveRawTime('special', stage));
                rawInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); autoSaveRawTime('special', stage); rawInput.blur(); } });
            }
            const container = document.getElementById(`penaltiesList-special-${stage}`);
            if (container) {
                container.querySelectorAll('.counter-inc').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.getAttribute('data-id');
                        const stageAttr = this.getAttribute('data-stage');
                        if (stageAttr !== stage) return;
                        const p = penaltiesLibrary.special[stage]?.find(p => p.id === id);
                        if (!p || !p.isCounter) return;
                        const max = p.maxCount || 10;
                        if (!tempPenalties['special']) tempPenalties['special'] = {};
                        if (!tempPenalties['special'][stage]) tempPenalties['special'][stage] = {};
                        const stageTemp = tempPenalties['special'][stage];
                        let val = getCounterValue(stageTemp, id) + 1;
                        if (val > max) val = max;
                        setCounterValue(stageTemp, id, val);
                        unsaved = true;
                        updateSpecialPenaltiesUI();
                        updateSpecialSummary();
                        updateSpecialBadge();
                    });
                });
                container.querySelectorAll('.counter-dec').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.getAttribute('data-id');

                        const p = penaltiesLibrary.special[stage]?.find(p => p.id === id);
                        if (!p || !p.isCounter) return;
                        if (!tempPenalties['special']) tempPenalties['special'] = {};
                        if (!tempPenalties['special'][stage]) tempPenalties['special'][stage] = {};
                        const stageTemp = tempPenalties['special'][stage];
                        let val = getCounterValue(stageTemp, id) - 1;
                        if (val < 0) val = 0;
                        setCounterValue(stageTemp, id, val);
                        unsaved = true;
                        updateSpecialPenaltiesUI();
                        updateSpecialSummary();
                        updateSpecialBadge();
                    });
                });
                container.querySelectorAll('.penalty-chk').forEach(chk => {
                    chk.addEventListener('change', function() {
                        const id = this.getAttribute('data-id');
                        const stageAttr = this.getAttribute('data-stage');
                        if (stageAttr !== stage) return;
                        if (!tempPenalties['special']) tempPenalties['special'] = {};
                        if (!tempPenalties['special'][stage]) tempPenalties['special'][stage] = {};
                        const stageTemp = tempPenalties['special'][stage];
                        if (this.checked) stageTemp[id] = true;
                        else delete stageTemp[id];
                        unsaved = true;
                        updateSpecialSummary();
                        updateSpecialBadge();
                    });
                });
            }
        }

        // Estafeta
        for (let stage of ESTAFETA_STAGES) {
            const saveBtn = document.getElementById(`saveStage-estafeta-${stage.id}`);
            if (saveBtn) saveBtn.addEventListener('click', () => saveEstafetaStage(stage.id));

                container.querySelectorAll('.counter-inc').forEach(btn => {

                        if (stageAttr !== stage.id) return;
                        const p = stage.penalties.find(p => p.id === id);
                        if (!p || !p.isCounter) return;

                        const stageTemp = tempPenalties['estafeta'][stage.id];
                        let val = getCounterValue(stageTemp, id) + 1;
                        if (val > max) val = max;
                        setCounterValue(stageTemp, id, val);
                        unsaved = true;
                        updateEstafetaPenaltiesUI();
                        updateEstafetaSummary();
                        updateEstafetaBadge();
                    });
                });
                container.querySelectorAll('.counter-dec').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();

                        const stageAttr = this.getAttribute('data-stage');
                        if (stageAttr !== stage.id) return;
                        const p = stage.penalties.find(p => p.id === id);

                        updateEstafetaPenaltiesUI();
                        updateEstafetaSummary();

                });
                container.querySelectorAll('.penalty-chk').forEach(chk => {
                    chk.addEventListener('change', function() {
                        const id = this.getAttribute('data-id');
                        const stageAttr = this.getAttribute('data-stage');

                        if (!tempPenalties['estafeta']) tempPenalties['estafeta'] = {};
                        if (!tempPenalties['estafeta'][stage.id]) tempPenalties['estafeta'][stage.id] = {};

                        unsaved = true;
                        updateEstafetaSummary();
                        updateEstafetaBadge();
                    });
                });
            }
        }

        // Остальные дисциплины
        for (let disc of DISCIPLINES) {
            if (disc === 'special' || disc === 'estafeta') continue;
            const saveBtn = document.getElementById(`saveStage-${disc}`);
            if (saveBtn) saveBtn.addEventListener('click', () => saveStage(disc));
            const resetBtn = document.getElementById(`resetStage-${disc}`);
            if (resetBtn) resetBtn.addEventListener('click', () => resetStage(disc));
            const rawInput = document.getElementById(`rawTime-${disc}`);
            if (rawInput) {
                rawInput.addEventListener('blur', () => autoSaveRawTime(disc, null));

                        updatePenaltiesUI(disc);
                        updateSummary(disc);
                        updateStageBadge(disc);
                    });
                });
                container.querySelectorAll('.counter-dec').forEach(btn => {
                    btn.addEventListener('click', function(e) {

        // Общее время эстафеты

        if (estafetaRawInput) {
            estafetaRawInput.addEventListener('blur', () => autoSaveRawTime('estafeta', null));
            estafetaRawInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); autoSaveRawTime('estafeta', null); estafetaRawInput.blur(); } });
        }
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    function init() {
        loadAllData();
        buildPanels();
        attachEventListeners();

        const tabBtns = tabsContainer.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const tabId = this.getAttribute('data-tab');
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active-pane'));
                const panel = document.getElementById(`panel-${tabId}`);
                if (panel) panel.classList.add('active-pane');
                if (tabId === 'results') {
                    renderOverallResults();
                } else {
                    currentDiscipline = tabId;
                    if (currentTeam) refreshUI();
                }
            });
        });
        document.querySelector('.tab-btn[data-tab="special"]').click();

        teamSelect.addEventListener('change', function() {
            currentTeam = this.value || null;
            if (currentTeam) {
                refreshUI();
                renderOverallResults();
            } else {
                for (let d of DISCIPLINES) {
                    if (d === 'special') {
                        for (let stage of SPECIAL_STAGES) {
                            const sumSpan = document.getElementById(`penaltySum-special-${stage}`);
                            if (sumSpan) sumSpan.innerText = '0';
                            const rawSpan = document.getElementById(`rawDisplay-special-${stage}`);
                            if (rawSpan) rawSpan.innerText = '—';
                            const totalSpan = document.getElementById(`totalDisplay-special-${stage}`);
                            if (totalSpan) totalSpan.innerText = '—';
                        }
                        const overallSum = document.getElementById(`penaltySum-special`);
                        if (overallSum) overallSum.innerText = '0';
                        const overallRaw = document.getElementById(`rawDisplay-special`);
                        if (overallRaw) overallRaw.innerText = '—';
                        const overallTotal = document.getElementById(`totalDisplay-special`);
                        if (overallTotal) overallTotal.innerText = '—';
                    } else if (d === 'estafeta') {
                        for (let stage of ESTAFETA_STAGES) {
                            const sumSpan = document.getElementById(`penaltySum-estafeta-${stage.id}`);
                            if (sumSpan) sumSpan.innerText = '0';
                        }
                        const overallSum = document.getElementById(`penaltySum-estafeta`);
                        if (overallSum) overallSum.innerText = '0';
                        const overallRaw = document.getElementById(`rawDisplay-estafeta`);
                        if (overallRaw) overallRaw.innerText = '—';
                        const overallTotal = document.getElementById(`totalDisplay-estafeta`);
                        if (overallTotal) overallTotal.innerText = '—';
                    } else {
                        const sumSpan = document.getElementById(`penaltySum-${d}`);
                        if (sumSpan) sumSpan.innerText = '0';
                        const rawSpan = document.getElementById(`rawDisplay-${d}`);
                        if (rawSpan) rawSpan.innerText = '—';
                        const totalSpan = document.getElementById(`totalDisplay-${d}`);
                        if (totalSpan) totalSpan.innerText = '—';
                    }
                }
                renderOverallResults();
            }
        });

        document.getElementById('printTeamReportBtn').addEventListener('click', printTeamReport);
        document.getElementById('printOverallReportBtn').addEventListener('click', printOverallReport);
        document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);

        if (teamSelect.value) {
            currentTeam = teamSelect.value;
            refreshUI();
            renderOverallResults();
        }
        renderOverallResults();
    }

    document.addEventListener('DOMContentLoaded', init);
})();
