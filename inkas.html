</head>

    // ===== ХЕЛПЕРЫ =====
    function formatTime(sec) {
        if (sec === null || isNaN(sec)) return "—";
        let m = Math.floor(sec / 60);
        let s = (sec % 60).toFixed(2);
        return `${m}:${s.toString().padStart(5, '0')}`;
    }

    function parseTime(str) {
        if (!str.trim()) return null;
        let parts = str.split(':');
        let m = 0, s = 0;
        if (parts.length === 2) { m = parseInt(parts[0]); s = parseFloat(parts[1]); }
        else if (parts.length === 3) { m = parseInt(parts[0])*60 + parseInt(parts[1]); s = parseFloat(parts[2]); }
        else if (parts.length === 1) { s = parseFloat(parts[0]); }
        else return null;
        if (isNaN(m) || isNaN(s)) return null;
        return m * 60 + s;
    }

    function getPenaltySum(penObj) {
        let sum = 0;
        for (let id in penObj) {
            const val = penObj[id];
            const p = penaltiesLibrary[currentDiscipline]?.find(p => p.id === id);
            if (p) {
                if (typeof val === 'number' && p.isCounter) sum += val * p.sec;
                else if (val === true || val === 1) sum += p.sec;
                else if (typeof val === 'number') sum += val * p.sec;
            }
        }
        return sum;
    }

    function getCounterValue(penObj, counterId) {
        const val = penObj[counterId];
        if (typeof val === 'number') return val;
        if (val === true) return 1;
        return 0;
    }

    function setCounterValue(penObj, counterId, value) {
        if (value <= 0) delete penObj[counterId];
        else penObj[counterId] = value;
    }

    function getTeamDisciplineData(teamCode, discipline) {
        if (!teamsData[teamCode]) {
            teamsData[teamCode] = { participant1Name: "", participant2Name: "", disciplines: {} };
        }
        if (!teamsData[teamCode].disciplines[discipline]) {
            teamsData[teamCode].disciplines[discipline] = { rawSeconds: null, penalties: {} };
        }
        return teamsData[teamCode].disciplines[discipline];
    }

    function getTeamNames(teamCode) {
        if (!teamsData[teamCode]) return { p1: "", p2: "" };
        return { p1: teamsData[teamCode].participant1Name || "", p2: teamsData[teamCode].participant2Name || "" };
    }

    function setTeamNames(teamCode, p1, p2) {
        if (!teamsData[teamCode]) teamsData[teamCode] = { participant1Name: "", participant2Name: "", disciplines: {} };
        teamsData[teamCode].participant1Name = p1;
        teamsData[teamCode].participant2Name = p2;
        saveAllData();
    }

    // ===== ЗАГРУЗКА / СОХРАНЕНИЕ ДАННЫХ (localStorage) =====
    function loadAllData() {
        const stored = localStorage.getItem('incassator_all_data');
        if (stored) {
            try { teamsData = JSON.parse(stored); } catch(e) { teamsData = {}; }
        }
        // Инициализация отсутствующих команд и дисциплин
        for (let code of TEAM_CODES) {
            if (!teamsData[code]) teamsData[code] = { participant1Name: "", participant2Name: "", disciplines: {} };
            for (let d of DISCIPLINES) {
                if (!teamsData[code].disciplines[d]) teamsData[code].disciplines[d] = { rawSeconds: null, penalties: {} };
            }
        }
    }

    function saveAllData() {
        localStorage.setItem('incassator_all_data', JSON.stringify(teamsData));
    }

    // ===== ПОСТРОЕНИЕ UI ДЛЯ ВКЛАДКИ =====

    function buildPanels() {
        let html = '';
        for (let d of DISCIPLINES) {
            html += buildPanel(d);
        }

        html += `<div id="panel-results" class="tab-pane">`;

        html += `<div class="subnote">* При равных суммах мест преимущество у участника с лучшим местом в эстафете, затем – в огневой подготовке.</div>`;

    // ===== ОБНОВЛЕНИЕ UI ДЛЯ ТЕКУЩЕЙ ДИСЦИПЛИНЫ И КОМАНДЫ =====
    function refreshUI() {
        if (!currentTeam || !currentDiscipline) {
            // скрыть всё или показать пустые
            return;
        }
        const disc = currentDiscipline;
        const team = teamsData[currentTeam];
        if (!team) return;
        const discData = getTeamDisciplineData(currentTeam, disc);
        const penObj = discData.penalties || {};

        // Имена
        const p1 = document.getElementById(`p1name-${disc}`);
        const p2 = document.getElementById(`p2name-${disc}`);
        if (p1) p1.value = team.participant1Name || "";
        if (p2) p2.value = team.participant2Name || "";

        // Время
        const rawInput = document.getElementById(`rawTime-${disc}`);
        if (rawInput) rawInput.value = discData.rawSeconds !== null ? formatTime(discData.rawSeconds) : "";

        // Штрафы: загружаем в tempPenalties
        tempPenalties = {};
        const disciplinePenalties = penaltiesLibrary[disc] || [];
        for (let p of disciplinePenalties) {
            if (penObj[p.id] !== undefined) tempPenalties[p.id] = penObj[p.id];
        }
        unsaved = false;

        // Обновить вид штрафов
        updatePenaltiesUI(disc);
        updateSummary(disc);
        updateStageBadge(disc);
        renderOverallTable(disc);
    }

    function updatePenaltiesUI(disc) {
        const container = document.getElementById(`penaltiesList-${disc}`);
        if (!container) return;
        const disciplinePenalties = penaltiesLibrary[disc] || [];
        for (let p of disciplinePenalties) {
            if (p.isCounter) {
                const countSpan = container.querySelector(`.counter-count[data-id="${p.id}"]`);
                const totalSpan = container.querySelector(`.counter-total[data-id="${p.id}"]`);
                const val = getCounterValue(tempPenalties, p.id);
                if (countSpan) countSpan.innerText = val;
                if (totalSpan) totalSpan.innerText = val * p.sec;
            } else {
                const chk = container.querySelector(`.penalty-chk[data-id="${p.id}"]`);
                if (chk) chk.checked = tempPenalties[p.id] === true;
            }
        }
    }

    function updateSummary(disc) {
        const sumSpan = document.getElementById(`penaltySum-${disc}`);
        const rawSpan = document.getElementById(`rawDisplay-${disc}`);
        const totalSpan = document.getElementById(`totalDisplay-${disc}`);
        if (!sumSpan || !rawSpan || !totalSpan) return;

        const team = teamsData[currentTeam];
        if (!team) { sumSpan.innerText = '0'; rawSpan.innerText = '—'; totalSpan.innerText = '—'; return; }
        const discData = getTeamDisciplineData(currentTeam, disc);
        const raw = discData.rawSeconds;
        // Сумма штрафов: постоянные + временные
        let merged = { ...discData.penalties };
        const discPen = penaltiesLibrary[disc] || [];
        for (let p of discPen) delete merged[p.id];
        for (let id in tempPenalties) merged[id] = tempPenalties[id];
        const penSum = getPenaltySum(merged);
        const total = raw !== null ? raw + penSum : null;

        sumSpan.innerText = penSum;
        rawSpan.innerText = raw !== null ? formatTime(raw) : '—';
        totalSpan.innerText = total !== null ? formatTime(total) : '—';
    }

    function updateStageBadge(disc) {
        const block = document.getElementById(`penaltyBlock-${disc}`);
        if (!block) return;
        let badge = block.querySelector('.unsaved-badge');
        if (unsaved && currentTeam) {
            if (!badge) {
                badge = document.createElement('span');
                badge.className = 'unsaved-badge';
                badge.innerText = '⚠️ есть изменения';
                block.querySelector('.action-buttons')?.appendChild(badge);
            }
        } else if (badge) badge.remove();
    }

    // ===== ТАБЛИЦА ОБЩЕГО ЗАЧЁТА ПО ДИСЦИПЛИНЕ =====
    function renderOverallTable(disc) {
        const tbody = document.getElementById(`overallBody-${disc}`);
        if (!tbody) return;
        let rows = [];
        for (let code of TEAM_CODES) {
            const team = teamsData[code];
            if (!team) continue;
            const discData = getTeamDisciplineData(code, disc);
            const raw = discData.rawSeconds;
            const pen = getPenaltySum(discData.penalties);
            const total = raw !== null ? raw + pen : null;
            const names = getTeamNames(code);
            rows.push({
                code,
                name: TEAM_NAMES[code] || code,
                p1: names.p1 || "—",
                p2: names.p2 || "—",
                raw,
                pen,
                total
            });
        }
        rows.sort((a,b) => (a.total ?? Infinity) - (b.total ?? Infinity));
        let rank = 1;
        let html = '';
        for (let r of rows) {
            const place = r.total !== null ? rank++ : '—';
            let cls = '';
            if (r.total !== null && rank-1 === 1) cls = 'rank-1';
            else if (r.total !== null && rank-1 === 2) cls = 'rank-2';
            else if (r.total !== null && rank-1 === 3) cls = 'rank-3';
            const placeHtml = (r.total !== null && parseInt(place) <= 3) ?
                `<span class="place-number"><span class="medal-icon">${place===1?'🥇':place===2?'🥈':'🥉'}</span> ${place}</span>` :
                place;
            html += `<tr class="${cls}"><td>${placeHtml}</td><td><strong>${r.name}</strong> (${r.code})</td><td>${r.p1}</td><td>${r.p2}</td><td>${r.raw !== null ? formatTime(r.raw) : '—'}</td><td>${r.pen}</td><td><strong>${r.total !== null ? formatTime(r.total) : '—'}</strong></td></tr>`;
        }
        if (!rows.length || rows.every(r => r.total === null)) html = '<tr><td colspan="7">Нет данных. Внесите результаты.</td></tr>';
        tbody.innerHTML = html;
    }

    // ===== ОБНОВЛЕНИЕ ВКЛАДКИ ИТОГИ =====
    function renderOverallResults() {
        const tbody = document.getElementById('resultsOverallBody');
        if (!tbody) return;
        // Для каждой команды считаем сумму мест по каждой дисциплине
        let summary = [];
        for (let code of TEAM_CODES) {
            const team = teamsData[code];
            if (!team) continue;
            let places = {};
            let totalSum = 0;
            let hasData = false;
            for (let d of DISCIPLINES) {
                const discData = getTeamDisciplineData(code, d);
                const raw = discData.rawSeconds;
                const pen = getPenaltySum(discData.penalties);
                const total = raw !== null ? raw + pen : null;
                // Вычисляем место среди всех команд для этой дисциплины
                let place = 12; // по умолчанию
                if (total !== null) {
                    // Собираем все тоталы по этой дисциплине
                    let totals = [];
                    for (let c of TEAM_CODES) {
                        const dData = getTeamDisciplineData(c, d);
                        const r = dData.rawSeconds;
                        const p = getPenaltySum(dData.penalties);
                        const t = r !== null ? r + p : null;
                        if (t !== null) totals.push({ code: c, total: t });
                    }
                    totals.sort((a,b) => a.total - b.total);
                    let rank = 1;
                    for (let item of totals) {
                        if (item.code === code) { place = rank; break; }
                        rank++;
                    }
                    hasData = true;
                }
                places[d] = place;
                totalSum += place;
            }
            if (hasData) {
                summary.push({
                    code,
                    name: TEAM_NAMES[code] || code,
                    places,
                    totalSum,
                    // для разрешения споров: места в эстафете и огневой
                    estafetaPlace: places.estafeta || 12,
                    firePlace: places.fire || 12
                });
            }
        }
        // Сортировка: по сумме мест, затем по эстафете, затем по огневой
        summary.sort((a,b) => {
            if (a.totalSum !== b.totalSum) return a.totalSum - b.totalSum;
            if (a.estafetaPlace !== b.estafetaPlace) return a.estafetaPlace - b.estafetaPlace;
            return a.firePlace - b.firePlace;
        });

        let rank = 1;
        let html = '';
        for (let s of summary) {
            const place = rank++;
            let cls = '';
            if (place === 1) cls = 'rank-1';
            else if (place === 2) cls = 'rank-2';
            else if (place === 3) cls = 'rank-3';
            const placeHtml = place <= 3 ? `<span class="place-number"><span class="medal-icon">${place===1?'🥇':place===2?'🥈':'🥉'}</span> ${place}</span>` : place;
            html += `<tr class="${cls}"><td>${placeHtml}</td><td><strong>${s.name}</strong> (${s.code})</td>`;
            for (let d of DISCIPLINES) {
                html += `<td>${s.places[d] || '—'}</td>`;
            }
            html += `<td><strong>${s.totalSum}</strong></td></tr>`;
        }
        if (!summary.length) html = '<tr><td colspan="8">Нет данных.</td></tr>';
        tbody.innerHTML = html;
    }

    // ===== СОХРАНЕНИЕ ШТРАФОВ ЭТАПА =====
    function saveStage(disc) {
        if (!currentTeam) { alert('Выберите команду'); return; }
        const discData = getTeamDisciplineData(currentTeam, disc);
        // Сохраняем tempPenalties в постоянные
        const disciplinePenalties = penaltiesLibrary[disc] || [];
        for (let p of disciplinePenalties) {
            if (tempPenalties[p.id] !== undefined) discData.penalties[p.id] = tempPenalties[p.id];
            else delete discData.penalties[p.id];
        }
        unsaved = false;
        saveAllData();
        updateStageBadge(disc);
        updateSummary(disc);
        renderOverallTable(disc);
        renderOverallResults();
        alert('Ошибки этапа сохранены для команды ' + currentTeam);
    }

    function resetStage(disc) {
        if (!currentTeam) return;
        const disciplinePenalties = penaltiesLibrary[disc] || [];
        for (let p of disciplinePenalties) {
            delete tempPenalties[p.id];
        }
        unsaved = false;
        updatePenaltiesUI(disc);
        updateSummary(disc);
        updateStageBadge(disc);
    }

    function saveRawTime(disc) {
        if (!currentTeam) { alert('Выберите команду'); return; }
        const rawInput = document.getElementById(`rawTime-${disc}`);
        const rawStr = rawInput.value.trim();
        let seconds = rawStr === "" ? null : parseTime(rawStr);
        if (rawStr !== "" && seconds === null) { alert('Неверный формат времени (мм:сс.сс)'); return; }
        const discData = getTeamDisciplineData(currentTeam, disc);
        discData.rawSeconds = seconds;
        saveAllData();
        updateSummary(disc);
        renderOverallTable(disc);
        renderOverallResults();
        alert('Время сохранено');
    }

    function saveNames(disc) {
        if (!currentTeam) return;
        const p1 = document.getElementById(`p1name-${disc}`);
        const p2 = document.getElementById(`p2name-${disc}`);
        if (p1) setTeamNames(currentTeam, p1.value, p2 ? p2.value : "");
        renderOverallTable(disc);
        renderOverallResults();
    }

    function printOverallReport() {
        const disc = currentDiscipline;
        // Собрать данные по всем командам
        let rows = [];
        for (let code of TEAM_CODES) {
            const team = teamsData[code];
            if (!team) continue;
            const discData = getTeamDisciplineData(code, disc);
            const raw = discData.rawSeconds;
            const pen = getPenaltySum(discData.penalties);
            const total = raw !== null ? raw + pen : null;
            const names = getTeamNames(code);
            rows.push({
                code,
                name: TEAM_NAMES[code] || code,
                p1: names.p1 || "—",
                p2: names.p2 || "—",
                raw,
                pen,
                total
            });
        }
        rows.sort((a,b) => (a.total ?? Infinity) - (b.total ?? Infinity));
        let rank = 1;
        let tableRows = '';
        for (let r of rows) {
            const place = r.total !== null ? rank++ : '—';
            tableRows += `<tr><td>${place}</td><td><strong>${r.name}</strong> (${r.code})</td><td>${r.p1}</td><td>${r.p2}</td><td>${r.raw !== null ? formatTime(r.raw) : '—'}</td><td>${r.pen}</td><td><strong>${r.total !== null ? formatTime(r.total) : '—'}</strong></td></tr>`;
        }
        if (!rows.length || rows.every(r => r.total === null)) tableRows = '<tr><td colspan="7">Нет данных</td></tr>';

        const now = new Date().toLocaleString('ru-RU');
        const html = `
            <div style="font-family: 'Segoe UI', sans-serif; max-width: 1100px; margin:0 auto; padding:5mm 4mm;">
                <style>@page { size: A4 portrait; margin: 8mm 6mm; }</style>
                <h1 style="text-align:center; font-size:14pt;">🏆 ИТОГОВЫЙ ПРОТОКОЛ</h1>
                <h2 style="text-align:center; font-size:12pt; color:#1e3a5f;">${DISCIPLINE_LABELS[disc]}</h2>
                <div style="text-align:center; font-size:8.5pt; margin-bottom:8px;">Дата формирования: ${now}</div>
                <table style="width:100%; border-collapse:collapse; font-size:8.5pt;">
                    <thead><tr style="background:#eef;"><th>Место</th><th>Команда</th><th>Участник 1</th><th>Участник 2</th><th>Чистое время</th><th>Штраф (сек)</th><th>Итог</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <div style="margin-top:16px; border-top:1px dashed #aaa; padding-top:10px;">
                    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px;">
                        <div><strong>Главный судья:</strong> __________________</div>
                        <div><strong>Секретарь:</strong> __________________</div>
                    </div>
                    <div style="margin-top:10px; display:flex; justify-content:flex-end;">
                        <div><strong>Дата:</strong> __________________</div>
                    </div>
                    <div style="margin-top:10px; font-size:8pt; text-align:center; color:#6c757d;">Официальный протокол</div>
                </div>
            </div>
        `;
        const container = document.getElementById('printReportContainer');
        container.innerHTML = html;
        container.style.display = 'block';
        window.print();
        container.style.display = 'none';
        container.innerHTML = '';
    }

    // ===== ЭКСПОРТ В EXCEL =====
    function exportExcel() {
        const disc = currentDiscipline;
        let rows = [];
        for (let code of TEAM_CODES) {
            const team = teamsData[code];
            if (!team) continue;
            const discData = getTeamDisciplineData(code, disc);
            const raw = discData.rawSeconds;
            const pen = getPenaltySum(discData.penalties);
            const total = raw !== null ? raw + pen : null;
            const names = getTeamNames(code);
            rows.push({
                "Команда": `${TEAM_NAMES[code]} (${code})`,
                "Участник 1": names.p1 || "—",
                "Участник 2": names.p2 || "—",
                "Чистое время": raw !== null ? formatTime(raw) : "—",
                "Штраф (сек)": pen,
                "Итог": total !== null ? formatTime(total) : "—"
            });
        }
        rows.sort((a,b) => {
            const tA = a["Итог"] === "—" ? Infinity : parseTime(a["Итог"]);
            const tB = b["Итог"] === "—" ? Infinity : parseTime(b["Итог"]);
            return tA - tB;
        });
        const wsData = [["Место", ...Object.keys(rows[0] || {})]];
        rows.forEach((row, idx) => {
            const place = row["Итог"] !== "—" ? idx+1 : "—";
            wsData.push([place, ...Object.values(row)]);
        });
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, DISCIPLINE_LABELS[disc]);
        XLSX.writeFile(wb, `incassator_${disc}_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    function init() {
        loadAllData();
        buildPanels();

        // Переключение вкладок
        const tabBtns = tabsContainer.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const tabId = this.getAttribute('data-tab');
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active-pane'));
                const panel = document.getElementById(`panel-${tabId}`);
                if (panel) panel.classList.add('active-pane');
                if (tabId === 'results') {
                    renderOverallResults();
                } else {
                    currentDiscipline = tabId;
                    if (currentTeam) {
                        refreshUI();
                    } else {
                        // показать пустые
                    }
                }
            });
        });
        // Активировать первую вкладку
        document.querySelector('.tab-btn[data-tab="special"]').click();

        // Выбор команды
        teamSelect.addEventListener('change', function() {
            currentTeam = this.value || null;
            if (currentTeam) {
                // Загрузить данные для текущей дисциплины
                refreshUI();
                // также обновить итоги
                renderOverallResults();
            } else {
                // очистить UI
                document.querySelectorAll('.tab-pane .section').forEach(s => {
                    const disc = s.closest('.tab-pane')?.id.replace('panel-', '');
                    if (disc && DISCIPLINES.includes(disc)) {
                        const summary = document.getElementById(`summary-${disc}`);
                        if (summary) summary.innerHTML = '';
                    }
                });
            }
        });

        // Навесить обработчики на кнопки в панелях (делегирование)
        panelsContainer.addEventListener('click', function(e) {
            const target = e.target;
            const disc = target.getAttribute('data-disc') || target.closest('.tab-pane')?.id.replace('panel-', '');
            if (!disc || !DISCIPLINES.includes(disc)) return;

            if (target.id === `saveStage-${disc}`) { saveStage(disc); return; }
            if (target.id === `resetStage-${disc}`) { resetStage(disc); return; }
            if (target.id === `saveRawTime-${disc}`) { saveRawTime(disc); return; }

            if (target.classList.contains('counter-inc') || target.classList.contains('counter-dec')) {
                const id = target.getAttribute('data-id');
                const discAttr = target.getAttribute('data-disc');
                if (!id || discAttr !== disc) return;
                const p = penaltiesLibrary[disc]?.find(p => p.id === id);
                if (!p || !p.isCounter) return;
                const delta = target.classList.contains('counter-inc') ? 1 : -1;
                const max = p.maxCount || 10;
                let val = getCounterValue(tempPenalties, id) + delta;
                val = Math.min(max, Math.max(0, val));
                setCounterValue(tempPenalties, id, val);
                unsaved = true;
                updatePenaltiesUI(disc);
                updateSummary(disc);
                updateStageBadge(disc);
                return;
            }

            if (target.classList.contains('penalty-chk')) {
                const id = target.getAttribute('data-id');
                const discAttr = target.getAttribute('data-disc');
                if (!id || discAttr !== disc) return;
                if (target.checked) tempPenalties[id] = true;
                else delete tempPenalties[id];
                unsaved = true;
                updateSummary(disc);
                updateStageBadge(disc);
                return;
            }
        });

        // Изменение имён участников
        panelsContainer.addEventListener('change', function(e) {
            const target = e.target;
            if (target.id && target.id.startsWith('p1name-') || target.id.startsWith('p2name-')) {
                const disc = target.id.replace('p1name-', '').replace('p2name-', '');
                if (DISCIPLINES.includes(disc)) {
                    saveNames(disc);
                }
            }
        });

        // Глобальные кнопки
        document.getElementById('printTeamReportBtn').addEventListener('click', printTeamReport);
        document.getElementById('printOverallReportBtn').addEventListener('click', printOverallReport);
        document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);

        // При загрузке, если есть сохранённая команда, выбрать её
        if (teamSelect.value) {
            currentTeam = teamSelect.value;
            refreshUI();
            renderOverallResults();
        }
        // Первоначальный рендер итогов
        renderOverallResults();
    }

    // Запуск
    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
