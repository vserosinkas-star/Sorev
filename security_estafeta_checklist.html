<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Чек-лист судьи — Эстафета "Охрана"</title>
    <style>
        * { box-sizing: border-box; }

        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            margin: 0;
            padding: 24px 20px;
            color: #1e2a3e;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        .main-header {
            background: linear-gradient(135deg, #1e3a5f, #0f2b44);
            color: white;
            padding: 20px 28px;
            border-radius: 32px;
            margin-bottom: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .main-header h1 { margin: 0 0 6px; font-size: 1.9rem; }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 16px 24px;
            border-radius: 48px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .print-btn {
            background: #2c5f2d;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .print-btn:hover { background: #1f4a20; transform: translateY(-2px); }
        .info-note {
            background: #fef9e3;
            border-left: 5px solid #f5a623;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #5e3a0c;
        }

        .meta-fields {
            background: #fefce8;
            border-radius: 28px;
            padding: 20px 28px;
            margin-bottom: 32px;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            border: 1px solid #fde68a;
            page-break-inside: avoid;
            break-inside: avoid;
        }
        .meta-field { flex: 1 1 200px; }
        .meta-field label {
            display: block;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #b45309;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .meta-field input, .meta-field textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 24px;
            border: 1px solid #d1d5db;
            font-size: 0.9rem;
            background: white;
            font-family: inherit;
        }

        .participant-section {
            background: white;
            border-radius: 32px;
            margin-bottom: 32px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .participant-header {
            background: #f1f5f9;
            padding: 18px 24px;
            border-radius: 32px 32px 0 0;
            border-bottom: 2px solid #cbd5e1;
        }
        .participant-header h2 { margin: 0; font-size: 1.6rem; font-weight: 700; color: #0c4a6e; }

        .penalty-table {
            width: 100%;
            border-collapse: collapse;
        }
        .penalty-table th {
            text-align: left;
            padding: 16px 20px 8px 24px;
            font-weight: 600;
            color: #334155;
            font-size: 0.85rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .penalty-table td {
            padding: 12px 20px 12px 24px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }
        .penalty-desc { font-weight: 500; font-size: 0.95rem; }
        .penalty-seconds {
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            color: #1e3a5f;
            display: inline-block;
        }
        .check-col { width: 70px; text-align: center; }
        .counter-col { width: 130px; }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: #1e3a8a; transform: scale(1.1); }
        .counter-input {
            width: 80px;
            padding: 8px 10px;
            font-size: 0.9rem;
            text-align: center;
            border-radius: 28px;
            border: 1px solid #cbd5e1;
            background: white;
            font-weight: 500;
        }

        .print-meta { display: none; }

        .sign-line {
            margin-top: 40px;
            border-top: 1px dashed #9ca3af;
            padding-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 30px;
            page-break-inside: avoid;
        }
        .sign-item { flex: 1; min-width: 200px; }
        .sign-item span { font-weight: 600; border-bottom: 1px dotted #4b5563; }

        .print-footer {
            text-align: center;
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 48px;
            padding-bottom: 20px;
            page-break-inside: avoid;
        }

        .field-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            padding: 0 24px;
        }
        .field-row .field { flex: 1; min-width: 180px; }
        .field-row label { font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 4px; color: #1e3a5f; }
        .field-row input { width: 100%; padding: 8px 12px; border-radius: 20px; border: 1px solid #cbd5e1; }

        @media print {
            body {
                background: white;
                padding: 0.1in;
                margin: 0;
                font-size: 8pt;
            }
            .toolbar, .print-btn, .info-note, .main-header, .meta-fields {
                display: none;
            }
            .print-meta {
                display: flex;
                background: #fefce8;
                border: 1px solid #cca;
                border-radius: 20px;
                padding: 8px 12px;
                margin-bottom: 10px;
                flex-wrap: wrap;
                gap: 8px;
                break-inside: avoid;
            }
            .participant-section {
                break-inside: avoid;
                page-break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ccc;
                margin-bottom: 0;
            }
            /* Каждый этап — на новой странице */
            .participant-section {
                page-break-before: always;
                break-before: page;
            }
            input[type="checkbox"] {
                transform: scale(0.9);
                border: 1px solid black;
            }
            .counter-input {
                border: 1px solid #000;
                background: none;
                padding: 2px;
                width: 50px;
                font-size: 8pt;
            }
            .participant-header {
                background: #eef2ff;
                padding: 6px 12px;
            }
            .participant-header h2 {
                font-size: 1.2rem;
            }
            .penalty-table th, .penalty-table td {
                padding: 4px 6px;
            }
            .penalty-desc {
                font-size: 8pt;
            }
            .penalty-seconds {
                font-size: 7pt;
                padding: 2px 6px;
            }
            .field-row {
                padding: 0 10px;
                margin-bottom: 8px;
            }
            .field-row label {
                font-size: 7pt;
            }
            .field-row input {
                font-size: 8pt;
                padding: 2px 6px;
            }
            .sign-line {
                margin-top: 15px;
                padding-top: 10px;
            }
            .print-footer {
                margin-top: 15px;
                padding-bottom: 10px;
            }
        }

        @media (max-width: 700px) {
            body { padding: 16px; }
            .penalty-table td, .penalty-table th { padding: 10px 12px; }
            .counter-col { width: auto; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main-header">
        <h1>🛡️ Эстафета "Охрана"</h1>
        <p>Чек-лист судьи — этапы: полоса препятствий, силовые, противопожарная</p>
    </div>

    <div class="toolbar">
        <div class="info-note">
            ✅ Для нарушений со счётчиком укажите количество раз. Штраф начисляется за каждое.
        </div>
        <button class="print-btn" id="printChecklistsBtn">🖨️ Распечатать чек-листы</button>
    </div>

    <div class="meta-fields" id="mainMetaBlock">
        <div class="meta-field"><label>🏦 Территориальный банк / команда</label><input type="text" id="teamName" placeholder="Например: Уральский (УБ)" value="_________________________"></div>
        <div class="meta-field"><label>⚖️ Судья (ФИО)</label><input type="text" id="judgeName" placeholder="Фамилия И.О." value="_________________________"></div>
        <div class="meta-field"><label>📅 Дата проведения</label><input type="text" id="eventDate" placeholder="ДД.ММ.ГГГГ" value="____.____.20__"></div>
        <div class="meta-field"><label>📝 Примечания</label><textarea id="remarks" rows="1" placeholder="Особые отметки, замечания...">_________________________</textarea></div>
    </div>

    <div id="participantsContainer"></div>
</div>

<script>
    const stages = ["Этап 1. Полоса препятствий", "Этап 2. Силовые упражнения", "Этап 3. Противопожарная подготовка"];
    
    const penaltiesLibrary = [
        { id: "common_not_done", category: "Общие", desc: "Невыполнение любого упражнения на этапах 1-3 (за каждое действие)", sec: 120, type: "count" },
        { id: "stage1_falsestart", category: "Этап 1. Полоса препятствий", desc: "Фальстарт (каждый раз)", sec: 5, type: "count" },
        { id: "stage1_fall_boom", category: "Этап 1. Полоса препятствий", desc: "Падение (спрыгивание) с бума", sec: 10, type: "count" },
        { id: "stage2_falsestart", category: "Этап 2. Силовые упражнения", desc: "Преждевременный старт (до финиша этапа 1) — за каждое действие", sec: 5, type: "count" },
        { id: "stage2_hammer_points", category: "Этап 2. Силовые упражнения", desc: "Удары кувалдой (силомер): не набрал очки", sec: 10, type: "bool" },
        { id: "stage2_fall_box", category: "Этап 2. Силовые упражнения", desc: "Падение с тумбы (прыжки на тумбы)", sec: 10, type: "count" },
        { id: "stage2_situp_ball", category: "Этап 2. Силовые упражнения", desc: "Sit up: медбол не коснулся земли", sec: 10, type: "count" },
        { id: "stage2_shuttle_line", category: "Этап 2. Силовые упражнения", desc: "Челночный бег: не касание ногой линии", sec: 10, type: "count" },
        { id: "stage2_pullup_miss", category: "Этап 2. Силовые упражнения", desc: "Подтягивания: недобор нормы (8 раз) — штраф за каждый недостающий", sec: 10, type: "pullup_counter" },
        { id: "stage3_falsestart", category: "Этап 3. Противопожарная подготовка", desc: "Преждевременный старт (до финиша этапа 2) — за каждое действие", sec: 5, type: "count" },
        { id: "stage3_bop_button", category: "Этап 3. Противопожарная подготовка", desc: "БОП-1: не застёгнута пуговица/крючок", sec: 5, type: "bool" },
        { id: "stage3_bop_straps", category: "Этап 3. Противопожарная подготовка", desc: "БОП-1: лямки брюк не надеты на плечи", sec: 5, type: "bool" },
        { id: "stage3_bop_belt", category: "Этап 3. Противопожарная подготовка", desc: "БОП-1: пояс не застёгнут или перекручен", sec: 5, type: "bool" },
        { id: "stage3_bop_helmet", category: "Этап 3. Противопожарная подготовка", desc: "БОП-1: подбородочный ремень каски не подтянут", sec: 5, type: "bool" },
        { id: "stage3_tires_miss", category: "Этап 3. Противопожарная подготовка", desc: "Покрышки с дымзавесой: непрохождение ногами внутри покрышки (за каждую)", sec: 5, type: "count" },
        { id: "stage3_hose_fall", category: "Этап 3. Противопожарная подготовка", desc: "Падение (бросание) пожарного рукава", sec: 5, type: "count" },
        { id: "stage3_no_connect", category: "Этап 3. Противопожарная подготовка", desc: "Неприсоединение рукава к разветвителю", sec: 20, type: "bool" }
    ];

    function createMetaClone() {
        const original = document.getElementById('mainMetaBlock');
        if (!original) return null;
        const clone = document.createElement('div');
        clone.className = 'print-meta';
        const fields = original.querySelectorAll('.meta-field');
        fields.forEach(field => {
            const clonedField = field.cloneNode(true);
            const inputs = clonedField.querySelectorAll('input, textarea');
            inputs.forEach(inp => {
                if (inp.id) inp.id = inp.id + '_clone_' + Math.random().toString(36).substr(2, 6);
            });
            clone.appendChild(clonedField);
        });
        return clone;
    }

    function syncMetaToClones() {
        const main = document.getElementById('mainMetaBlock');
        const clones = document.querySelectorAll('.print-meta');
        if (!main) return;
        const team = main.querySelector('#teamName')?.value || '';
        const judge = main.querySelector('#judgeName')?.value || '';
        const date = main.querySelector('#eventDate')?.value || '';
        const remarks = main.querySelector('#remarks')?.value || '';

        clones.forEach(clone => {
            const teamInp = clone.querySelector('input[id*="teamName"]');
            if (teamInp) teamInp.value = team;
            const judgeInp = clone.querySelector('input[id*="judgeName"]');
            if (judgeInp) judgeInp.value = judge;
            const dateInp = clone.querySelector('input[id*="eventDate"]');
            if (dateInp) dateInp.value = date;
            const remarksArea = clone.querySelector('textarea[id*="remarks"]');
            if (remarksArea) remarksArea.value = remarks;
        });
    }

    function buildParticipantSection(participantNumber, stageName) {
        const cloneMeta = createMetaClone();
        const section = document.createElement('div');
        section.className = 'participant-section';
        if (cloneMeta) section.appendChild(cloneMeta);

        const header = document.createElement('div');
        header.className = 'participant-header';
        header.innerHTML = `<h2>👤 ${stageName}</h2>`;
        section.appendChild(header);

        const fieldsDiv = document.createElement('div');
        fieldsDiv.className = 'field-row';
        fieldsDiv.innerHTML = `
            <div class="field"><label>ФИО участника</label><input type="text" class="participant-name-field" placeholder="Фамилия И.О." value="_________________________"></div>
        `;
        section.appendChild(fieldsDiv);

        const table = document.createElement('table');
        table.className = 'penalty-table';
        const thead = document.createElement('thead');
        thead.innerHTML = `<tr><th>Нарушение / описание</th><th class="check-col">✓ Отметка</th><th class="counter-col">Кол-во (для счётчика)</th><th>Штраф (сек)</th></tr>`;
        table.appendChild(thead);
        const tbody = document.createElement('tbody');

        const commonPen = penaltiesLibrary.filter(p => p.category === "Общие");
        for (let p of commonPen) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="penalty-desc">${p.desc}</td>
                <td class="check-col">—</td>
                <td class="counter-col"><input type="number" class="counter-input" data-id="${p.id}" min="0" max="20" value="0" step="1"></td>
                <td><span class="penalty-seconds">+${p.sec} сек/каждое</span></td>
            `;
            tbody.appendChild(row);
        }

        const stagePen = penaltiesLibrary.filter(p => p.category === stageName);
        for (let p of stagePen) {
            const row = document.createElement('tr');
            if (p.type === 'count') {
                row.innerHTML = `
                    <td class="penalty-desc">${p.desc}</td>
                    <td class="check-col">—</td>
                    <td class="counter-col"><input type="number" class="counter-input" data-id="${p.id}" min="0" max="20" value="0" step="1"></td>
                    <td><span class="penalty-seconds">+${p.sec} сек/каждое</span></td>
                `;
            } else if (p.type === 'bool') {
                row.innerHTML = `
                    <td class="penalty-desc">${p.desc}</td>
                    <td class="check-col"><input type="checkbox" data-id="${p.id}"></td>
                    <td class="counter-col">—</td>
                    <td><span class="penalty-seconds">+${p.sec} сек</span></td>
                `;
            } else if (p.type === 'pullup_counter') {
                row.innerHTML = `
                    <td class="penalty-desc">${p.desc} (норма 8 раз)</td>
                    <td class="check-col">—</td>
                    <td class="counter-col"><input type="number" class="counter-input" data-id="${p.id}" min="0" max="8" value="8" step="1"></td>
                    <td><span class="penalty-seconds">+${p.sec} сек за каждый недостающий</span></td>
                `;
            }
            tbody.appendChild(row);
        }

        table.appendChild(tbody);
        section.appendChild(table);

        // Блок подписей (для каждого этапа)
        const signBlock = document.createElement('div');
        signBlock.className = 'sign-line';
        signBlock.innerHTML = `
            <div class="sign-item"><span>Подпись судьи</span><br><br> __________________________</div>
            <div class="sign-item"><span>Подпись представителя команды</span><br><br> __________________________</div>
            <div class="sign-item"><span>Расшифровка подписи</span><br><br> __________________________</div>
        `;
        section.appendChild(signBlock);

        // Футер (для каждого этапа)
        const footerBlock = document.createElement('div');
        footerBlock.className = 'print-footer';
        footerBlock.innerHTML = `
            Официальный чек-лист нарушений по эстафете «Охрана»<br>
            Каждая отметка фиксирует факт нарушения. Для счётчиков — количество в поле «Кол-во».
        `;
        section.appendChild(footerBlock);

        return section;
    }

    function buildAllParticipants() {
        const container = document.getElementById('participantsContainer');
        container.innerHTML = '';
        for (let i = 0; i < stages.length; i++) {
            const section = buildParticipantSection(i+1, stages[i]);
            container.appendChild(section);
        }
        syncMetaToClones();
    }

    document.getElementById('printChecklistsBtn').addEventListener('click', () => {
        syncMetaToClones();
        window.print();
    });

    const mainInputs = document.querySelectorAll('#mainMetaBlock input, #mainMetaBlock textarea');
    mainInputs.forEach(inp => {
        inp.addEventListener('input', () => syncMetaToClones());
        inp.addEventListener('change', () => syncMetaToClones());
    });

    buildAllParticipants();

    const placeholders = document.querySelectorAll('#mainMetaBlock input, #mainMetaBlock textarea');
    placeholders.forEach(inp => {
        if (inp.value === "_________________________" || inp.value === "____.____.20__") {
            inp.style.color = "#6c757d";
            inp.addEventListener('focus', function() {
                if (this.value === "_________________________" || this.value === "____.____.20__") this.value = "";
            });
            inp.addEventListener('blur', function() {
                if (this.value === "") {
                    if (this.id === "eventDate") this.value = "____.____.20__";
                    else this.value = "_________________________";
                    syncMetaToClones();
                }
            });
        }
    });
</script>
</body>
</html>
