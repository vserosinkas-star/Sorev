            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;

            gap: 8px;

            cursor: pointer;
        }

            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

            align-items: flex-end;
            margin-bottom: 20px;

            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 160px;
            flex: 1;
        }
        .control-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #2c3e66;
        }

            border-radius: 16px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 1rem;
            width: 100%;
        }
        button {

            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;

        .print-btn:hover { background: #1f4a20; }
        .excel-btn { background: #0f766e; }

            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;

            color: #b45309;
            padding: 4px 12px;
            border-radius: 30px;

            flex-wrap: wrap;

            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e293b;
            transition: 0.2s;
        }
        .stage-btn.active {
            background: #1e3a8a;
            color: white;
        }

            margin: 20px 0;

            overflow-y: auto;
            padding-right: 8px;
        }

            background: #f9fafb;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .penalty-card .desc {
            flex: 2;
            font-size: 0.9rem;
            font-weight: 500;
        }

            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;

            gap: 8px;
            background: white;
            border-radius: 40px;
            padding: 4px 12px;
            border: 1px solid #cbd5e1;

            font-size: 1.2rem;
            line-height: 1;
            margin: 0;
            width: auto;
        }

            min-width: 32px;
            text-align: center;
            font-weight: bold;
        }
        .penalty-highlight-green {
            background: #dcfce7 !important;
            border-left: 6px solid #15803d !important;
        }

            justify-content: space-between;

            padding: 6px 18px;

        }

            border-radius: 28px;

            padding: 4px;

            border: 1px solid #e2edf7;

            <button id="saveRawTimeBtn">💾 Зафиксировать время</button>

        </div>
    </div>

    <div class="results-table">

    // ---------- СОСТОЯНИЕ ----------
    let currentDirection = null;
    let currentTeam = null;
    let currentStage = stages[0];
    let tempPenalties = {};
    let hasUnsavedChanges = false;
    
    // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
    function formatTime(sec) {
        if (sec === null || isNaN(sec)) return "—";
        let minutes = Math.floor(sec / 60);
        let seconds = (sec % 60).toFixed(2);
        return minutes + ":" + seconds.toString().padStart(5, '0');
    }
    function parseTime(str) {
        if (!str.trim()) return null;
        str = str.trim();
        let parts = str.split(':');
        let minutes = 0, seconds = 0;
        if (parts.length === 2) {
            minutes = parseInt(parts[0]) || 0;
            let secPart = parts[1];
            let dotIndex = secPart.indexOf('.');
            if (dotIndex !== -1) {
                seconds = parseInt(secPart.substring(0, dotIndex)) || 0;
                let fraction = parseFloat('0.' + secPart.substring(dotIndex + 1)) || 0;
                seconds += fraction;
            } else {
                seconds = parseInt(secPart) || 0;
            }
        } else if (parts.length === 1) {
            let secPart = parts[0];
            let dotIndex = secPart.indexOf('.');
            if (dotIndex !== -1) seconds = parseFloat(secPart);
            else seconds = parseInt(secPart) || 0;
            minutes = 0;
        } else return null;
        let total = minutes * 60 + seconds;
        return isNaN(total) ? null : total;
    }
    function getPenaltySum(penObj) {
        if (!penObj) return 0;
        let sum = 0;
        for (let id in penObj) {
            let p = penaltiesLibrary.find(p => p.id === id);
            if (p) {
                let val = penObj[id];
                if (typeof val === 'number') sum += val * p.sec;
                else if (val === true) sum += p.sec;
            }
        }
        let pmMisses = penObj[SHOOT_PM_MISS_ID] || 0;
        let saigaHits = penObj[SHOOT_SAIGA_HITS_ID] || 0;
        sum += pmMisses * PENALTY_PER_MISS_PM;
        sum -= saigaHits * SAIGA_BONUS_PER_HIT;
        return sum;
    }
    function getBankConesCount(penObj) {
        if (!penObj) return 0;
        if (penObj.bank_cone_4) return 4;
        if (penObj.bank_cone_3) return 3;
        if (penObj.bank_cone_2) return 2;
        if (penObj.bank_cone_1) return 1;
        return 0;
    }
    function setBankConesCount(count) {
        delete tempPenalties.bank_cone_1;
        delete tempPenalties.bank_cone_2;
        delete tempPenalties.bank_cone_3;
        delete tempPenalties.bank_cone_4;
        if (count === 1) tempPenalties.bank_cone_1 = true;
        else if (count === 2) tempPenalties.bank_cone_2 = true;
        else if (count === 3) tempPenalties.bank_cone_3 = true;
        else if (count >= 4) tempPenalties.bank_cone_4 = true;
    }
    function getSnakeConesCount(penObj) {
        if (!penObj) return 0;
        if (penObj.snake_cone3) return 4;
        if (penObj.snake_cone2) return 3;
        if (penObj.snake_cone1) return 2;
        if (penObj.snake_cone) return 1;
        return 0;
    }
    function setSnakeConesCount(count) {
        delete tempPenalties.snake_cone;
        delete tempPenalties.snake_cone1;
        delete tempPenalties.snake_cone2;
        delete tempPenalties.snake_cone3;
        if (count === 1) tempPenalties.snake_cone = true;
        else if (count === 2) tempPenalties.snake_cone1 = true;
        else if (count === 3) tempPenalties.snake_cone2 = true;
        else if (count >= 4) tempPenalties.snake_cone3 = true;
    }
    function getPrestupnikConesCount(penObj) {
        if (!penObj) return 0;
        if (penObj.prestupnik_cone3) return 4;
        if (penObj.prestupnik_cone2) return 3;
        if (penObj.prestupnik_cone1) return 2;
        if (penObj.prestupnik_cone) return 1;
        return 0;
    }
    function setPrestupnikConesCount(count) {
        delete tempPenalties.prestupnik_cone;
        delete tempPenalties.prestupnik_cone1;
        delete tempPenalties.prestupnik_cone2;
        delete tempPenalties.prestupnik_cone3;
        if (count === 1) tempPenalties.prestupnik_cone = true;
        else if (count === 2) tempPenalties.prestupnik_cone1 = true;
        else if (count === 3) tempPenalties.prestupnik_cone2 = true;
        else if (count >= 4) tempPenalties.prestupnik_cone3 = true;
    }
    
    // ---------- SUPABASE ОПЕРАЦИИ ----------
    async function fetchWithRetry(fn, retries = 3, delay = 1000) {
        for (let i = 0; i < retries; i++) {
            try { return await fn(); } catch (err) {
                if (i === retries - 1) throw err;
                await new Promise(resolve => setTimeout(resolve, delay));
            }
        }
    }
    async function loadTeamData(dir, team) {
        if (!dir || !team) return null;
        return await fetchWithRetry(async () => {
            let { data, error } = await supabaseClient
                .from('estafeta_results')
                .select('raw_seconds, penalties')
                .eq('direction', dir)
                .eq('team_code', team)
                .maybeSingle();
            if (error) throw error;
            return data;
        }).catch(err => { console.error(err); return null; });
    }
    async function saveTeamData(dir, team, rawSeconds, penalties) {
        let upsertData = { direction: dir, team_code: team, raw_seconds: rawSeconds, penalties: penalties, updated_at: new Date().toISOString() };
        await fetchWithRetry(async () => {
            let { error } = await supabaseClient.from('estafeta_results').upsert(upsertData, { onConflict: 'direction, team_code' });
            if (error) throw error;
        }).catch(err => console.error(err));
    }
    async function loadAllResults() {
        try {
            let { data, error } = await supabaseClient.from('estafeta_results').select('direction, team_code, raw_seconds, penalties');
            if (error) throw error;
            let rows = [];
            for (let r of data) {
                let raw = r.raw_seconds;
                let penalty = getPenaltySum(r.penalties);
                let total = raw !== null ? raw + penalty : null;
                rows.push({ team: r.team_code, name: teamNames[r.team_code] || r.team_code, dir: r.direction, raw, penalty, total });
            }
            rows.sort((a,b) => {
                if (a.total === null && b.total === null) return 0;
                if (a.total === null) return 1;
                if (b.total === null) return -1;
                return a.total - b.total;
            });
            let tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            let rank = 1;
            for (let r of rows) {
                let tr = document.createElement('tr');
                if (r.total !== null && rank === 1) tr.classList.add('rank-1');
                tr.innerHTML = `<td>${r.total !== null ? rank++ : '—'}</td><td><strong>${r.name}</strong> (${r.team})</td><td>${r.dir}</td><td>${r.raw !== null ? formatTime(r.raw) : '—'}</td><td>${r.penalty}</td><td>${r.total !== null ? formatTime(r.total) : '—'}</td>`;
                tbody.appendChild(tr);
            }
            if (rows.length === 0) tbody.innerHTML = '<tr><td colspan="6">Нет данных. Внесите результаты.</td></tr>';
        } catch (err) {
            console.error(err);
            document.getElementById('resultsBody').innerHTML = `<tr><td colspan="6">Ошибка загрузки: ${err.message}</td></tr>`;
        }
    }
    
    async function refreshCurrentTeamData() {
        if (!currentDirection || !currentTeam) {
            document.getElementById('rawTimeDisplay').innerText = '—';
            document.getElementById('totalPenaltyDisplay').innerText = '0';
            document.getElementById('totalTimeDisplay').innerText = '—';
            document.getElementById('rawTimeInput').value = '';
            document.getElementById('penaltiesContainer').innerHTML = '<div style="grid-column:1/-1; text-align:center;">⚠️ Выберите направление и банк</div>';
            return;
        }
        let data = await loadTeamData(currentDirection, currentTeam);
        if (data) {
            let raw = data.raw_seconds;
            let penaltiesObj = data.penalties || {};
            let totalPen = getPenaltySum(penaltiesObj);
            document.getElementById('rawTimeDisplay').innerText = raw !== null ? formatTime(raw) : '—';
            document.getElementById('totalPenaltyDisplay').innerText = totalPen;
            let total = raw !== null ? raw + totalPen : null;
            document.getElementById('totalTimeDisplay').innerText = total !== null ? formatTime(total) : '—';
            document.getElementById('rawTimeInput').value = raw !== null ? formatTime(raw) : '';
            
            let stagePenalties = penaltiesLibrary.filter(p => p.category === currentStage);
            tempPenalties = {};
            for (let p of stagePenalties) {
                let saved = penaltiesObj[p.id];
                if (saved !== undefined) {
                    if (typeof saved === 'number') tempPenalties[p.id] = saved;
                    else if (saved === true) tempPenalties[p.id] = true;
                    else if (saved === false) tempPenalties[p.id] = false;
                    else tempPenalties[p.id] = saved;
                } else {
                    if (counterPenaltyIds.includes(p.id)) tempPenalties[p.id] = 0;
                    else tempPenalties[p.id] = false;
                }
            }
            if (currentStage === "Стрельба") {
                tempPenalties[SHOOT_PM_MISS_ID] = (typeof penaltiesObj[SHOOT_PM_MISS_ID] === 'number') ? penaltiesObj[SHOOT_PM_MISS_ID] : 0;
                tempPenalties[SHOOT_SAIGA_HITS_ID] = (typeof penaltiesObj[SHOOT_SAIGA_HITS_ID] === 'number') ? penaltiesObj[SHOOT_SAIGA_HITS_ID] : 0;
            } else {
                delete tempPenalties[SHOOT_PM_MISS_ID];
                delete tempPenalties[SHOOT_SAIGA_HITS_ID];
            }
            hasUnsavedChanges = false;
        } else {
            document.getElementById('rawTimeDisplay').innerText = '—';
            document.getElementById('totalPenaltyDisplay').innerText = '0';
            document.getElementById('totalTimeDisplay').innerText = '—';
            document.getElementById('rawTimeInput').value = '';
            tempPenalties = {};
            hasUnsavedChanges = false;
            let stagePenalties = penaltiesLibrary.filter(p => p.category === currentStage);
            for (let p of stagePenalties) {
                if (counterPenaltyIds.includes(p.id)) tempPenalties[p.id] = 0;
                else tempPenalties[p.id] = false;
            }
            if (currentStage === "Стрельба") {
                tempPenalties[SHOOT_PM_MISS_ID] = 0;
                tempPenalties[SHOOT_SAIGA_HITS_ID] = 0;
            }
        }
        renderPenalties();
        updateBadge();
        updateSummaryFromTemp();
    }
    
    // ОТРИСОВКА ШТРАФОВ (полная версия)
    function renderPenalties() {
        if (!currentDirection || !currentTeam) {
            document.getElementById('penaltiesContainer').innerHTML = '<div style="grid-column:1/-1; text-align:center;">⚠️ Выберите направление и банк</div>';
            return;
        }
        if (currentStage === "Стрельба") {
            let pmMisses = tempPenalties[SHOOT_PM_MISS_ID] || 0;
            let saigaHits = tempPenalties[SHOOT_SAIGA_HITS_ID] || 0;
            let pmPenalty = pmMisses * PENALTY_PER_MISS_PM;
            let saigaBonus = saigaHits * SAIGA_BONUS_PER_HIT;
            let html = `
                <div class="penalty-card"><div class="desc"><strong>🔫 ПМ (4 выстрела) — ПРОМАХИ (1 промах = +30 сек)</strong></div><div class="counter-control"><button class="pm-dec">−</button><span class="pm-count">${pmMisses}</span><button class="pm-inc">+</button></div><div style="font-size:0.75rem;">Штраф: +${pmPenalty} сек</div></div>
                <div class="penalty-card"><div class="desc"><strong>🎯 САЙГА-12 (5 выстрелов) — ПОПАДАНИЯ (1 попадание = –10 сек)</strong></div><div class="counter-control"><button class="saiga-dec">−</button><span class="saiga-count">${saigaHits}</span><button class="saiga-inc">+</button></div><div style="font-size:0.75rem;">Бонус: –${saigaBonus} сек</div></div>
            `;
            let stagePen = penaltiesLibrary.filter(p => p.category === "Стрельба");
            for (let p of stagePen) {
                let checked = tempPenalties[p.id] === true;
                const greenClass = isGreenHighlight(p.id) ? 'penalty-highlight-green' : '';
                html += `<div class="penalty-card ${greenClass}"><input type="checkbox" id="chk_${p.id}" data-id="${p.id}" ${checked ? 'checked' : ''}><label for="chk_${p.id}">${p.desc}<span class="penalty-sec">+${p.sec} сек</span></label></div>`;
            }
            document.getElementById('penaltiesContainer').innerHTML = html;
            attachShootHandlers(pmMisses, saigaHits);
            for (let p of stagePen) {
                let cb = document.getElementById(`chk_${p.id}`);
                if (cb) cb.onchange = (e) => { tempPenalties[e.target.dataset.id] = e.target.checked; hasUnsavedChanges = true; updateSummaryFromTemp(); updateBadge(); };
            }
            updateSummaryFromTemp();
            return;
        }
        
        let stagePen = penaltiesLibrary.filter(p => p.category === currentStage);
        if (stagePen.length === 0) {
            document.getElementById('penaltiesContainer').innerHTML = `<div style="grid-column:1/-1; text-align:center;">📭 Для этапа "${currentStage}" нет ошибок</div>`;
            return;
        }
        
        const isBankStage = (currentStage === "Получение банковских ценностей");
        const isSnakeStage = (currentStage === "Змейка");
        const isPrestupnikStage = (currentStage === "Вооруженный преступник");
        
        let bankCones = isBankStage ? getBankConesCount(tempPenalties) : 0;
        let snakeCones = isSnakeStage ? getSnakeConesCount(tempPenalties) : 0;
        let prestupnikCones = isPrestupnikStage ? getPrestupnikConesCount(tempPenalties) : 0;
        
        let html = '';
        for (let p of stagePen) {
            if (isBankStage && ['bank_cone_1','bank_cone_2','bank_cone_3','bank_cone_4'].includes(p.id)) {
                if (p.id === 'bank_cone_1') {
                    let conePenalty = [0,5,10,15,20][Math.min(bankCones,4)];
                    html += `<div class="penalty-card"><div class="desc"><strong>Наезд на конусы (количество)</strong><span class="penalty-sec">+5 сек/конус (макс. 20)</span></div><div class="counter-control"><button class="cones-dec">−</button><span class="cones-count">${bankCones}</span><button class="cones-inc">+</button></div><div style="font-size:0.75rem;">Штраф: +${conePenalty} сек</div></div>`;
                }
                continue;
            }
            if (isSnakeStage && ['snake_cone','snake_cone1','snake_cone2','snake_cone3'].includes(p.id)) {
                if (p.id === 'snake_cone') {
                    let conePenalty = snakeCones * 5;
                    html += `<div class="penalty-card"><div class="desc"><strong>Наезд на конус/бочку</strong><span class="penalty-sec">+5 сек за каждый</span></div><div class="counter-control"><button class="snake-cones-dec">−</button><span class="snake-cones-count">${snakeCones}</span><button class="snake-cones-inc">+</button></div><div style="font-size:0.75rem;">Штраф: +${conePenalty} сек</div></div>`;
                }
                continue;
            }
            if (isPrestupnikStage && ['prestupnik_cone','prestupnik_cone1','prestupnik_cone2','prestupnik_cone3'].includes(p.id)) {
                if (p.id === 'prestupnik_cone') {
                    let conePenalty = prestupnikCones * 5;
                    html += `<div class="penalty-card"><div class="desc"><strong>Наезд на конус (преступник)</strong><span class="penalty-sec">+5 сек за каждый</span></div><div class="counter-control"><button class="prest-cones-dec">−</button><span class="prest-cones-count">${prestupnikCones}</span><button class="prest-cones-inc">+</button></div><div style="font-size:0.75rem;">Штраф: +${conePenalty} сек</div></div>`;
                }
                continue;
            }
            if (counterPenaltyIds.includes(p.id)) {
                let currentVal = (typeof tempPenalties[p.id] === 'number') ? tempPenalties[p.id] : 0;
                let totalSec = currentVal * p.sec;
                html += `<div class="penalty-card"><div class="desc">${p.desc}<span class="penalty-sec">+${p.sec} сек/каждое</span></div><div class="counter-control"><button class="counter-dec" data-id="${p.id}">−</button><span class="counter-val" data-id="${p.id}">${currentVal}</span><button class="counter-inc" data-id="${p.id}">+</button></div><div style="font-size:0.75rem;">Штраф: +${totalSec} сек</div></div>`;
                continue;
            }
            let checked = tempPenalties[p.id] === true;
            const greenClass = isGreenHighlight(p.id) ? 'penalty-highlight-green' : '';
            html += `<div class="penalty-card ${greenClass}"><input type="checkbox" id="chk_${p.id}" data-id="${p.id}" ${checked ? 'checked' : ''}><label for="chk_${p.id}">${p.desc}<span class="penalty-sec">+${p.sec} сек</span></label></div>`;
        }
        document.getElementById('penaltiesContainer').innerHTML = html;
        
        // Обработчики чекбоксов
        for (let p of stagePen) {
            if (counterPenaltyIds.includes(p.id)) continue;
            if (isBankStage && ['bank_cone_1','bank_cone_2','bank_cone_3','bank_cone_4'].includes(p.id)) continue;
            if (isSnakeStage && ['snake_cone','snake_cone1','snake_cone2','snake_cone3'].includes(p.id)) continue;
            if (isPrestupnikStage && ['prestupnik_cone','prestupnik_cone1','prestupnik_cone2','prestupnik_cone3'].includes(p.id)) continue;
            let cb = document.getElementById(`chk_${p.id}`);
            if (cb) cb.onchange = (e) => { tempPenalties[e.target.dataset.id] = e.target.checked; hasUnsavedChanges = true; updateSummaryFromTemp(); updateBadge(); };
        }
        // Обработчики счётчиков
        for (let p of stagePen.filter(p => counterPenaltyIds.includes(p.id))) {
            let dec = document.querySelector(`.counter-dec[data-id="${p.id}"]`);
            let inc = document.querySelector(`.counter-inc[data-id="${p.id}"]`);
            let span = document.querySelector(`.counter-val[data-id="${p.id}"]`);
            if (dec && inc && span) {
                let update = (delta) => {
                    let old = (typeof tempPenalties[p.id] === 'number') ? tempPenalties[p.id] : 0;
                    let newVal = Math.max(0, old + delta);
                    tempPenalties[p.id] = newVal;
                    span.innerText = newVal;
                    let totalSec = newVal * p.sec;
                    let parent = span.closest('.penalty-card');
                    let secDiv = parent.querySelector('div:last-child');
                    if (secDiv) secDiv.innerText = `Штраф: +${totalSec} сек`;
                    hasUnsavedChanges = true;
                    updateSummaryFromTemp();
                    updateBadge();
                };
                dec.onclick = () => update(-1);
                inc.onclick = () => update(1);
            }
        }
        // Конусы банк
        if (isBankStage) {
            let dec = document.querySelector('.cones-dec'), inc = document.querySelector('.cones-inc'), span = document.querySelector('.cones-count');
            if (dec && inc && span) {
                let update = (newCount) => {
                    newCount = Math.max(0, Math.min(10, newCount));
                    setBankConesCount(newCount);
                    span.innerText = newCount;
                    let conePenalty = [0,5,10,15,20][Math.min(newCount,4)];
                    let parent = span.closest('.penalty-card');
                    let secDiv = parent.querySelector('div:last-child');
                    if (secDiv) secDiv.innerText = `Штраф: +${conePenalty} сек`;
                    hasUnsavedChanges = true;
                    updateSummaryFromTemp();
                    updateBadge();
                };
                dec.onclick = () => update(parseInt(span.innerText) - 1);
                inc.onclick = () => update(parseInt(span.innerText) + 1);
            }
        }
        // Конусы змейка
        if (isSnakeStage) {
            let dec = document.querySelector('.snake-cones-dec'), inc = document.querySelector('.snake-cones-inc'), span = document.querySelector('.snake-cones-count');
            if (dec && inc && span) {
                let update = (newCount) => {
                    newCount = Math.max(0, newCount);
                    setSnakeConesCount(newCount);
                    span.innerText = newCount;
                    let conePenalty = newCount * 5;
                    let parent = span.closest('.penalty-card');
                    let secDiv = parent.querySelector('div:last-child');
                    if (secDiv) secDiv.innerText = `Штраф: +${conePenalty} сек`;
                    hasUnsavedChanges = true;
                    updateSummaryFromTemp();
                    updateBadge();
                };
                dec.onclick = () => update(parseInt(span.innerText) - 1);
                inc.onclick = () => update(parseInt(span.innerText) + 1);
            }
        }
        // Конусы преступник
        if (isPrestupnikStage) {
            let dec = document.querySelector('.prest-cones-dec'), inc = document.querySelector('.prest-cones-inc'), span = document.querySelector('.prest-cones-count');
            if (dec && inc && span) {
                let update = (newCount) => {
                    newCount = Math.max(0, newCount);
                    setPrestupnikConesCount(newCount);
                    span.innerText = newCount;
                    let conePenalty = newCount * 5;
                    let parent = span.closest('.penalty-card');
                    let secDiv = parent.querySelector('div:last-child');
                    if (secDiv) secDiv.innerText = `Штраф: +${conePenalty} сек`;
                    hasUnsavedChanges = true;
                    updateSummaryFromTemp();
                    updateBadge();
                };
                dec.onclick = () => update(parseInt(span.innerText) - 1);
                inc.onclick = () => update(parseInt(span.innerText) + 1);
            }
        }
        updateSummaryFromTemp();
    }
    
    function attachShootHandlers(pmMisses, saigaHits) {
        let pmDec = document.querySelector('.pm-dec'), pmInc = document.querySelector('.pm-inc'), pmSpan = document.querySelector('.pm-count');
        if (pmDec && pmInc && pmSpan) {
            let updatePM = (delta) => { let newVal = Math.max(0, Math.min(4, pmMisses + delta)); tempPenalties[SHOOT_PM_MISS_ID] = newVal; pmSpan.innerText = newVal; let penalty = newVal * PENALTY_PER_MISS_PM; let parent = pmSpan.closest('.penalty-card'); let secDiv = parent.querySelector('div:last-child'); if (secDiv) secDiv.innerText = `Штраф: +${penalty} сек`; hasUnsavedChanges = true; updateSummaryFromTemp(); updateBadge(); };
            pmDec.onclick = () => updatePM(-1);
            pmInc.onclick = () => updatePM(1);
        }
        let saigaDec = document.querySelector('.saiga-dec'), saigaInc = document.querySelector('.saiga-inc'), saigaSpan = document.querySelector('.saiga-count');
        if (saigaDec && saigaInc && saigaSpan) {
            let updateSaiga = (delta) => { let newVal = Math.max(0, Math.min(5, saigaHits + delta)); tempPenalties[SHOOT_SAIGA_HITS_ID] = newVal; saigaSpan.innerText = newVal; let bonus = newVal * SAIGA_BONUS_PER_HIT; let parent = saigaSpan.closest('.penalty-card'); let secDiv = parent.querySelector('div:last-child'); if (secDiv) secDiv.innerText = `Бонус: –${bonus} сек`; hasUnsavedChanges = true; updateSummaryFromTemp(); updateBadge(); };
            saigaDec.onclick = () => updateSaiga(-1);
            saigaInc.onclick = () => updateSaiga(1);
        }
    }
    
    async function updateSummaryFromTemp() {
        if (!currentDirection || !currentTeam) return;
        let data = await loadTeamData(currentDirection, currentTeam);
        let savedPen = data?.penalties || {};
        let merged = { ...savedPen };
        let stagePenalties = penaltiesLibrary.filter(p => p.category === currentStage);
        for (let p of stagePenalties) delete merged[p.id];
        for (let id in tempPenalties) {
            let val = tempPenalties[id];
            if (val === true || (typeof val === 'number' && val !== 0)) merged[id] = val;
            else if (val === false || val === 0) delete merged[id];
        }
        let totalDisplay = getPenaltySum(merged);
        document.getElementById('totalPenaltyDisplay').innerText = totalDisplay;
        let raw = data?.raw_seconds ?? null;
        let total = raw !== null ? raw + totalDisplay : null;
        document.getElementById('totalTimeDisplay').innerText = total !== null ? formatTime(total) : '—';
    }
    
    function updateBadge() {
        let div = document.getElementById('stageInfo');
        let old = div.querySelector('.unsaved-badge');
        if (old) old.remove();
        if (hasUnsavedChanges && currentDirection && currentTeam) {
            let badge = document.createElement('span');
            badge.className = 'unsaved-badge';
            badge.innerText = '⚠️ Есть несохранённые изменения';
            div.appendChild(badge);
        }
    }
    
    async function saveStage() {
        if (!currentDirection || !currentTeam) { showToast('Выберите команду'); return; }
        let existing = await loadTeamData(currentDirection, currentTeam);
        let penaltiesObj = existing?.penalties || {};
        let stagePenalties = penaltiesLibrary.filter(p => p.category === currentStage);
        for (let p of stagePenalties) delete penaltiesObj[p.id];
        for (let id in tempPenalties) {
            let val = tempPenalties[id];
            if (val === true || (typeof val === 'number' && val !== 0)) penaltiesObj[id] = val;
            else if (val === false || val === 0) delete penaltiesObj[id];
        }
        let rawSeconds = existing?.raw_seconds ?? null;
        await saveTeamData(currentDirection, currentTeam, rawSeconds, penaltiesObj);
        hasUnsavedChanges = false;
        updateBadge();
        await refreshCurrentTeamData();
        await loadAllResults();
        showToast('Ошибки этапа сохранены');
    }
    
    async function saveRawTime() {
        if (!currentDirection || !currentTeam) { showToast('Выберите команду'); return; }
        let rawStr = document.getElementById('rawTimeInput').value.trim();
        let rawSeconds = rawStr === '' ? null : parseTime(rawStr);
        if (rawStr !== '' && rawSeconds === null) { showToast('Неверный формат времени. Используйте мм:сс.сс'); return; }
        let existing = await loadTeamData(currentDirection, currentTeam);
        let penaltiesObj = existing?.penalties || {};
        await saveTeamData(currentDirection, currentTeam, rawSeconds, penaltiesObj);
        await refreshCurrentTeamData();
        await loadAllResults();
        showToast('Время сохранено');
    }
    
    async function resetAllPenalties() {
        if (!currentDirection || !currentTeam) { showToast('Выберите команду'); return; }
        if (!confirm('Сбросить ВСЕ ошибки для этой команды?')) return;
        let existing = await loadTeamData(currentDirection, currentTeam);
        let rawSeconds = existing?.raw_seconds ?? null;
        await saveTeamData(currentDirection, currentTeam, rawSeconds, {});
        await refreshCurrentTeamData();
        await loadAllResults();
        showToast('Сброшено');
    }
    
    function resetTemp() { refreshCurrentTeamData(); }
    
    async function printFullReport() {
        if (!currentDirection || !currentTeam) { showToast('Сначала выберите направление и команду!'); return; }
        const data = await loadTeamData(currentDirection, currentTeam);
        if (!data) { showToast('Нет сохранённых данных для этой команды.'); return; }
        const rawSec = data.raw_seconds;
        const penaltiesObj = data.penalties || {};
        const activePenalties = [];
        for (let [id, val] of Object.entries(penaltiesObj)) {
            if (val === true || (typeof val === 'number' && val > 0)) {
                const penaltyInfo = penaltiesLibrary.find(p => p.id === id);
                if (penaltyInfo) {
                    let count = (typeof val === 'number') ? val : 1;
                    for (let i = 0; i < count; i++) activePenalties.push({ ...penaltyInfo });
                }
            }
        }
        let pmMisses = penaltiesObj[SHOOT_PM_MISS_ID] || 0;
        let saigaHits = penaltiesObj[SHOOT_SAIGA_HITS_ID] || 0;
        if (pmMisses > 0) activePenalties.push({ category: "Стрельба", desc: `Промахи из ПМ (${pmMisses} шт.)`, sec: pmMisses * PENALTY_PER_MISS_PM });
        if (saigaHits > 0) activePenalties.push({ category: "Стрельба", desc: `Попадания из Сайги-12 (${saigaHits} шт.)`, sec: -saigaHits * SAIGA_BONUS_PER_HIT });
        const grouped = {};
        for (let p of activePenalties) { if (!grouped[p.category]) grouped[p.category] = []; grouped[p.category].push(p); }
        const totalPenalty = getPenaltySum(penaltiesObj);
        const totalTime = (rawSec !== null && rawSec !== undefined) ? rawSec + totalPenalty : null;
        const teamFullName = teamNames[currentTeam] || currentTeam;
        const now = new Date().toLocaleString('ru-RU');
        const printHtml = `<div style="font-family: 'Segoe UI', system-ui, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px;"><h1 style="text-align: center;">🏁 ОТЧЕТ О ПРОХОЖДЕНИИ ЭСТАФЕТЫ</h1><div style="text-align: center; margin-bottom: 24px;">Дата формирования: ${now}</div><div style="background: #f8fafc; padding: 16px; border-radius: 16px; margin-bottom: 24px;"><div><strong>Команда:</strong> ${teamFullName} (${currentTeam})</div><div><strong>Направление:</strong> ${currentDirection}</div><div><strong>Чистое время:</strong> ${rawSec !== null ? formatTime(rawSec) : '—'}</div><div><strong>Общий штраф:</strong> ${totalPenalty} секунд</div><div><strong>Итоговое время:</strong> ${totalTime !== null ? formatTime(totalTime) : '—'}</div></div><h3>📋 Перечень допущенных ошибок:</h3>${Object.keys(grouped).length === 0 ? '<p>✅ Штрафные нарушения отсутствуют.</p>' : Object.entries(grouped).map(([stageName, arr]) => `<div style="margin-bottom: 20px;"><h4>🎯 ${stageName}</h4><table style="width:100%; border-collapse: collapse;"><thead><tr style="background:#e2e8f0;"><th style="padding:8px; text-align:left;">Нарушение</th><th style="padding:8px;">Штраф (сек)</th></tr></thead><tbody>${arr.map(p => `<tr><td style="padding:8px;">${p.desc}</td><td style="padding:8px;">${p.sec >= 0 ? '+' : ''}${p.sec}</td></tr>`).join('')}</tbody></table></div>`).join('')}<div class="print-sign-line" style="margin-top: 48px; border-top: 1px dashed #aaa; padding-top: 24px;"><div style="display: flex; justify-content: space-between; flex-wrap: wrap;"><div><strong>Представитель команды:</strong> __________________</div><div><strong>Главный Судья (ФИО):</strong> __________________</div></div><div style="margin-top: 20px; text-align: right;"><strong>Дата:</strong> __________________</div><div style="margin-top: 20px; font-size: 10px; text-align: center;">Подпись представителя команды подтверждает согласие с результатами.</div></div></div>`;
        const container = document.getElementById('printReportContainer');
        container.innerHTML = printHtml;
        container.style.display = 'block';
        window.print();
        container.style.display = 'none';
        container.innerHTML = '';
    }
    
    function renderStageButtons() {
        const container = document.getElementById('stageButtonsContainer');
        let html = '';
        for (let stage of stages) {
            html += `<button class="stage-btn ${currentStage === stage ? 'active' : ''}" data-stage="${stage}">${stage}</button>`;
        }
        container.innerHTML = html;
        document.querySelectorAll('.stage-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const newStage = btn.getAttribute('data-stage');
                if (newStage === currentStage) return;
                currentStage = newStage;
                renderStageButtons();
                if (currentDirection && currentTeam) refreshCurrentTeamData();
                else { tempPenalties = {}; hasUnsavedChanges = false; renderPenalties(); updateBadge(); }
            });
        });
    }
    
    async function onSelectionChange() {
        currentDirection = document.getElementById('directionSelect').value ? parseInt(document.getElementById('directionSelect').value) : null;
        currentTeam = document.getElementById('teamSelect').value || null;
        if (currentDirection && currentTeam) await refreshCurrentTeamData();
        else {
            document.getElementById('penaltiesContainer').innerHTML = '<div style="grid-column:1/-1; text-align:center;">⚠️ Выберите направление и банк</div>';
            document.getElementById('rawTimeDisplay').innerText = '—';
            document.getElementById('totalPenaltyDisplay').innerText = '0';
            document.getElementById('totalTimeDisplay').innerText = '—';
        }
        let span = document.querySelector('#stageInfo span:first-child');
        if (span && currentDirection && currentTeam) {
            let teamName = document.getElementById('teamSelect').options[document.getElementById('teamSelect').selectedIndex]?.text || currentTeam;
            span.innerText = `📍 Направление ${currentDirection}, команда ${teamName} | Этап: ${currentStage}`;
        } else if (span) span.innerText = '✅ Выберите направление, банк и этап';
    }
    
    function exportToExcel() {
        const table = document.getElementById('resultsTable');
        const cloneTable = table.cloneNode(true);
        const now = new Date().toLocaleString('ru-RU');
        const caption = document.createElement('caption');
        caption.style.fontSize = '16px';
        caption.style.marginBottom = '10px';
        caption.style.fontWeight = 'bold';
        caption.innerText = `Результаты эстафеты (сформировано: ${now})`;
        cloneTable.prepend(caption);
        const wb = `<html><head><meta charset="UTF-8"><title>Результаты эстафеты</title><style>th,td{border:1px solid #ccc;padding:6px;text-align:center;}table{border-collapse:collapse;width:100%;}.rank-1{background-color:#fef9c3;}</style></head><body>${cloneTable.outerHTML}</body></html>`;
        const blob = new Blob([wb], { type: 'application/vnd.ms-excel' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = 'estafeta_results.xls';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
    
    function goHome() { window.location.href = '/'; }
    
    function showToast(msg) {
        let statusDiv = document.getElementById('connectionStatus');
        let toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.right = '20px';
        toast.style.backgroundColor = '#1e3a5f';
        toast.style.color = 'white';
        toast.style.padding = '10px 18px';
        toast.style.borderRadius = '40px';
        toast.style.fontSize = '0.85rem';
        toast.style.zIndex = '1000';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    async function init() {
        let statusDiv = document.getElementById('connectionStatus');
        statusDiv.innerHTML = '<span class="status-warning">⏳ Проверка подключения...</span>';
        try {
            let { error } = await supabaseClient.from('estafeta_results').select('count', { count: 'exact', head: true });
            if (error) throw error;
            statusDiv.innerHTML = '<span class="status-ok">✅ Подключено</span>';
        } catch (err) {
            console.error(err);
            statusDiv.innerHTML = `<span class="status-error">❌ Ошибка: ${err.message}. Данные будут только локально.</span>`;
        }
        await loadAllResults();
        renderStageButtons();
        document.getElementById('directionSelect').addEventListener('change', onSelectionChange);
        document.getElementById('teamSelect').addEventListener('change', onSelectionChange);
        document.getElementById('saveStageBtn').addEventListener('click', saveStage);
        document.getElementById('resetStageBtn').addEventListener('click', resetTemp);
        document.getElementById('saveRawTimeBtn').addEventListener('click', saveRawTime);
        document.getElementById('resetTeamBtn').addEventListener('click', resetAllPenalties);
        document.getElementById('printReportBtn').addEventListener('click', printFullReport);
        document.getElementById('excelExportBtn').addEventListener('click', exportToExcel);
        document.getElementById('homeBtn').addEventListener('click', goHome);
        onSelectionChange();
    }
    init();
})();
</script>
</body>
